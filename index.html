<html lang="zh-TW"><head><meta charset="utf-8">

<title>AI 二胡老師</title>
<style>
:root{--bg:#f4f3f0;--sf:#fff;--sf2:#efeeea;--fg:#1c1c1e;--mut:#6b6b70;--mut2:#a0a0a6;--ln:rgba(28,28,30,.07);--bd:#e2e0db;--ac:#2f5d50;--acf:#fff;--acs:rgba(47,93,80,.09);--ok:#2f7d62;--bad:#b86b2a;--hg:linear-gradient(140deg,#2f5d50,#1d3b33);--hf:#f2faf6;
--sh:0 1px 2px rgba(20,20,20,.04),0 14px 32px -18px rgba(20,20,20,.2);--r:1.25rem;--rm:.875rem;--ease:cubic-bezier(.3,.7,.2,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c0d0e;--sf:#161719;--sf2:#1f2023;--fg:#f5f5f7;--mut:#a1a1a6;--mut2:#6e6e73;--ln:rgba(255,255,255,.08);--bd:#2c2d31;--ac:#7fc4ae;--acf:#0c1512;--acs:rgba(127,196,174,.13);--ok:#7fc4ae;--bad:#e0a063;--hg:linear-gradient(140deg,#21413a,#12211d);--hf:#eaf6f1;--sh:0 0 0 1px rgba(255,255,255,.03) inset,0 14px 32px -18px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c0d0e;--sf:#161719;--sf2:#1f2023;--fg:#f5f5f7;--mut:#a1a1a6;--mut2:#6e6e73;--ln:rgba(255,255,255,.08);--bd:#2c2d31;--ac:#7fc4ae;--acf:#0c1512;--acs:rgba(127,196,174,.13);--ok:#7fc4ae;--bad:#e0a063;--hg:linear-gradient(140deg,#21413a,#12211d);--hf:#eaf6f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans TC","PingFang TC","Hiragino Sans",sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"h""m""n"}
button,select,input{font:inherit;color:inherit}
.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}
/* header */
header{grid-area:h;display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.25rem}
.brand{display:flex;align-items:center;gap:.65rem;font-weight:600;font-size:1rem;letter-spacing:-.01em}
.logo{width:2rem;height:2rem;border-radius:.6rem;background:var(--hg);color:var(--hf);display:grid;place-items:center}
.logo .ic{width:1.1rem;height:1.1rem}
.sb{display:none}
.chip{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--ln);background:var(--sf);border-radius:2rem;padding:.35rem .85rem;font-size:.8125rem;font-weight:500;cursor:pointer;transition:.2s var(--ease)}
.chip::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--ac)}
.chip:hover{background:var(--sf2)}.chip:active{transform:scale(.96)}
/* nav */
nav{grid-area:n;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--sf) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--ln);padding:.35rem .5rem}
nav button{background:none;border:0;border-radius:.75rem;padding:.4rem 0 .3rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.6875rem;font-weight:500;color:var(--mut2);cursor:pointer;transition:color .2s,transform .15s}
nav button:active{transform:scale(.93)}
nav button.on{color:var(--ac)}
/* main */
main{grid-area:m;overflow-y:auto;padding:.5rem 1.25rem 2rem}
.wrap{max-width:62rem;margin:0 auto}
section{display:none}section.on{display:block;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}
.narrow{max-width:38rem;margin:0 auto}
.pt{padding:.5rem 0 1.5rem}
.pt h1{font-size:2rem;line-height:1.1;font-weight:700;letter-spacing:-.035em;margin:0}
.pt p{margin:.5rem 0 0;color:var(--mut);font-size:1rem}
.cols{display:grid;gap:1rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:1.5rem}
.lbl{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);margin:0 0 .9rem}
.mut{color:var(--mut)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;border:0;border-radius:var(--rm);background:var(--ac);color:var(--acf);font-weight:600;padding:.85rem 1.4rem;cursor:pointer;transition:transform .15s var(--ease),filter .2s,box-shadow .2s;box-shadow:0 6px 16px -8px var(--ac)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.lg{width:100%;padding:1rem 1.4rem;font-size:1.0625rem}
.btn.inv{background:var(--hf);color:#1d3b33;box-shadow:none}
.btn.alt{background:var(--sf2);color:var(--fg);box-shadow:none;border:1px solid var(--ln)}.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--bad);box-shadow:none;border:1px solid var(--ln)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* segmented */
.seg{display:flex;background:var(--sf2);border-radius:var(--rm);padding:.2rem;gap:.15rem}
.seg button{flex:1;border:0;background:transparent;border-radius:.65rem;padding:.55rem .5rem;font-weight:500;font-size:.9rem;color:var(--mut);cursor:pointer;transition:.25s var(--ease)}
.seg button.sel{background:var(--sf);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 1px var(--ln)}
/* home */
.hero{background:var(--hg);color:var(--hf);border-radius:var(--r);padding:1.75rem;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-3rem;top:-3rem;width:12rem;height:12rem;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.hero p{margin:.6rem 0 1.4rem;font-size:1.0625rem;line-height:1.55;position:relative;z-index:1;max-width:30rem}
.tiles{display:grid;gap:1rem;grid-template-columns:1fr 1fr}
.tile{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:1.25rem;cursor:pointer;transition:transform .2s var(--ease),border-color .2s;display:flex;flex-direction:column;gap:.9rem}
.tile:hover{border-color:var(--ac)}.tile:active{transform:scale(.98)}
.ico{width:2.75rem;height:2.75rem;border-radius:.85rem;background:var(--acs);color:var(--ac);display:grid;place-items:center}
.tile b{display:block;font-size:1.0625rem;letter-spacing:-.015em}
.tile span.mut{font-size:.8125rem;line-height:1.4;display:block;margin-top:.2rem}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:.9rem;padding:.95rem 1.25rem;min-height:3.5rem;width:100%;background:none;border:0;text-align:left;cursor:default}
.li+.li{border-top:1px solid var(--ln)}
button.li{cursor:pointer;transition:background .15s}button.li:active{background:var(--sf2)}
.li .t{flex:1}.li .v{color:var(--mut);display:flex;align-items:center;gap:.3rem}
.li .ic{color:var(--mut2)}
.pill{display:inline-block;font-size:.6875rem;font-weight:600;padding:.15rem .6rem;border-radius:2rem;background:var(--sf2);color:var(--mut)}
.gap{height:1.5rem}
/* gauge */
.gauge{width:100%;max-width:25rem;margin:0 auto;display:block;overflow:visible}
#needle{transition:transform .14s var(--ease),opacity .3s;transform-origin:140px 130px;opacity:.3}
.note{font-size:4.5rem;font-weight:600;line-height:1;text-align:center;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:.5rem}
.sub{text-align:center;color:var(--mut);font-size:.9375rem;margin-top:.4rem;font-variant-numeric:tabular-nums;min-height:1.5rem}
#status{text-align:center;font-weight:600;font-size:.9375rem;margin:1rem auto 0;padding:.4rem 1rem;border-radius:2rem;width:fit-content;background:color-mix(in srgb,currentColor 10%,transparent);transition:color .2s}
#status:empty{visibility:hidden}
#cents{font-variant-numeric:tabular-nums}
canvas{width:100%;height:8rem;display:block}
.hint{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mut2);margin-top:.5rem}
/* metronome */
.bpm{font-size:5rem;font-weight:600;letter-spacing:-.05em;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bpmu{text-align:center;color:var(--mut2);font-size:.75rem;font-weight:600;letter-spacing:.1em;margin:.4rem 0 1.5rem}
.step{display:flex;gap:.5rem;margin-top:1.25rem}
.step button{flex:1;border:1px solid var(--ln);background:var(--sf2);border-radius:var(--rm);padding:.65rem 0;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;transition:.15s}
.step button:active{transform:scale(.94);background:var(--bd)}
.dots{display:flex;gap:.75rem;justify-content:center;margin:.5rem 0 1.5rem}
.dots i{width:1rem;height:1rem;border-radius:50%;background:var(--bd);transition:background .08s,transform .12s var(--ease)}
.dots i.hit{background:var(--ac);transform:scale(1.5)}.dots i.hit.acc{background:var(--ok);transform:scale(1.8)}
/* form controls */
input[type=range]{-webkit-appearance:none;appearance:none;height:.375rem;border-radius:1rem;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--bd) var(--p,0%));width:100%;margin:.6rem 0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3),0 0 0 1px var(--ln)}
input[type=range]::-moz-range-thumb{width:1.6rem;height:1.6rem;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:3rem;height:1.8rem;border-radius:2rem;background:var(--bd);position:relative;transition:background .25s;cursor:pointer;flex:none;margin:0}
input[type=checkbox]::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
input[type=checkbox]:checked{background:var(--ac)}input[type=checkbox]:checked::after{transform:translateX(1.2rem)}
select{-webkit-appearance:none;appearance:none;background:transparent;border:0;color:var(--mut);text-align:right;cursor:pointer;padding:.2rem 0;max-width:12rem}
select option{color:#222}
label.li{cursor:pointer}
/* onboarding */
.ov{position:fixed;inset:0;background:var(--bg);z-index:9;overflow-y:auto;padding:calc(2rem + env(safe-area-inset-top,0px)) 1.25rem calc(2rem + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .35s}
.ov.on{opacity:1;pointer-events:auto}.ov>div{max-width:30rem;margin:0 auto}
.ov h1{font-size:2rem;letter-spacing:-.035em;line-height:1.15;margin:1.5rem 0 .5rem}
.role{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--ln);border-radius:var(--r);padding:1.1rem;margin-top:.75rem;cursor:pointer;box-shadow:var(--sh);transition:.25s var(--ease)}
.role:hover{border-color:var(--mut2)}.role:active{transform:scale(.985)}
.role.cur{border-color:var(--ac);background:var(--acs)}
.role .tx{flex:1}.role b{display:block;font-size:1.0625rem;letter-spacing:-.015em}.role .mut{font-size:.8125rem;line-height:1.4;display:block}
.role::after{content:"";width:1.4rem;height:1.4rem;border-radius:50%;border:1.5px solid var(--bd);flex:none;transition:.25s}
.role.cur::after{border:.45rem solid var(--ac);background:#fff}
.lang{display:flex;justify-content:center;margin-top:1.75rem}.lang select{text-align:center;color:var(--mut)}
/* big text mode & responsive */
html.big nav button{font-size:.55rem}
@media (min-width:640px){.tiles{gap:1.25rem}.pt h1{font-size:2.5rem}main{padding:.5rem 2rem 3rem}header{padding:.75rem 2rem}}
@media (min-width:900px){
 html:not(.big) body{grid-template-columns:16rem 1fr;grid-template-areas:"n h""n m"}
 html:not(.big) nav{flex-direction:column;display:flex;gap:.25rem;padding:1.5rem 1rem;border-top:0;border-right:1px solid var(--ln);background:var(--sf)}
 html:not(.big) nav button{flex-direction:row;gap:.8rem;padding:.7rem .9rem;font-size:.9375rem;justify-content:flex-start}
 html:not(.big) nav button.on{background:var(--acs)}
 html:not(.big) nav .sb{display:flex;margin:0 .4rem 1.5rem}
 html:not(.big) header .hb{visibility:hidden}
 html:not(.big) .cols{grid-template-columns:1fr 1fr;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wide{max-width:44rem}

h_beat|讓你跟著穩定的節拍練習。§點中間的數字可直接輸入速度（30–500），也可用滑桿或 ± 按鈕。選拍數（1 拍為每一下都一樣）與音色，按「開始」。電腦可直接用鍵盤打數字、Enter 確認、空白鍵開始或停止、方向鍵微調。§第一拍是重拍。戴耳機時節拍更清楚。§節拍器本身不做分析；視譜視唱會用同樣的節拍聲引導。§50 BPM、4 拍，每拍拉一個長弓。|Practice with a steady beat.§Tap the number to type a tempo (30–500), or use the slider and ± buttons. Pick beats per bar (1 means no accent) and a sound, then press Start. On a computer, type digits, Enter to confirm, Space to start or stop, arrow keys to adjust.§The first beat is accented. Headphones help.§The metronome itself does no analysis; sight-reading uses the same click.§50 BPM in 4, one long bow per beat.|安定した拍に合わせて練習します。§中央の数字をタップしてテンポ（30〜500）を入力、またはスライダーや±ボタンで調整。拍子（1は毎拍同じ）と音色を選び「開始」。パソコンでは数字キー入力、Enterで確定、スペースで開始・停止、矢印キーで微調整。§1拍目が強拍です。イヤホンを使うと聞き取りやすくなります。§メトロノーム自体は分析しません。初見演奏でも同じクリック音でガイドします。§50 BPM・4拍子で、1拍ごとに長弓を1回。
h_drill|由 AI 隨機出譜，聽你演奏並評分，培養視奏能力。§先選五線譜或簡譜、調式、拍號與節奏，按「開始演奏」，聽完一小節預備拍後開始拉。§可開啟「拍子引導」持續打拍、「位置引導」在譜上標出現在該拉的音。請戴耳機避免拍子聲被收音。音符變綠是正確，橘是一項不準，紅是漏掉。§目前演奏到第幾小節、提早或落後幾毫秒、音準、節奏、強弱對比，並給練習建議。§4/4、D 大調、四分與八分音符，速度 60，練到音準與節奏都超過 80%。|The AI writes a random score, listens and grades you to build sight-reading skill.§Choose staff or jianpu, mode, meter and rhythms, press Start, hear one bar of count-in, then play.§Use headphones so the count-in is not picked up. Green is correct, amber means one aspect is off, red is missed.§Current bar, how many ms early or late, pitch, rhythm, dynamic contrast and practice suggestions.§4/4 in D major with quarters and eighths at 60 BPM, until pitch and rhythm both pass 80%.|AIがランダムに譜面を作り、演奏を聴いて採点し、初見力を育てます。§五線譜か数字譜、調、拍子、リズムを選び「演奏する」を押し、1小節のカウントのあとに弾きます。§「拍ガイド」で拍を鳴らし続け、「位置ガイド」で今弾く音を表示できます。カウント音を拾わないようイヤホン推奨。緑は正解、オレンジは1項目ずれ、赤は抜け。§今何小節目か、何ミリ秒早い・遅いか、音程、リズム、強弱の対比、練習アドバイス。§4/4・D長調・四分と八分音符・テンポ60で、音程とリズムがどちらも80%を超えるまで。
h_set|管理身分、外觀、AI 與隱私。§在各群組中調整，變更會立即套用，並自動儲存在這台裝置。§目前資料只存在本機。清除瀏覽器資料或刪除帳號會一併刪除。§AI 回答的詳細程度、語音與練習建議都可以在這裡設定。§切換成「樂齡學習者」，字體與按鈕會立即放大。|Manage your role, appearance, AI and privacy.§Change any group and it applies instantly, saved on this device.§Data lives on this device only. Clearing browser data or deleting the account removes it.§Answer detail, voice and practice suggestions are all set here.§Switch to Senior learner and text and buttons grow immediately.|役割、外観、AI、プライバシーを管理します。§各グループで変更するとすぐに反映され、この端末に自動保存されます。§データはこの端末にのみ保存されます。ブラウザのデータ消去やアカウント削除で一緒に消えます。§AIの回答の詳しさ、音声、練習アドバイスはここで設定できます。§「シニア学習者」に切り替えると、文字とボタンがすぐに大きくなります。
g_tune|歡迎第一次使用 AI 音準分析，我將引導您完成第一次分析。§步驟 1：選擇要調的弦。內弦是 D，外弦是 A，也可以選自由偵測。§步驟 2：按下「開始」，並允許使用麥克風。§步驟 3：拉一個長音。指針偏左是偏低，偏右是偏高，到中間就準了。|Welcome to AI pitch analysis for the first time. I will guide you through your first analysis.§Step 1: Choose a string. Inner is D, outer is A, or use free detect.§Step 2: Press Start and allow the microphone.§Step 3: Play one long note. Needle left means flat, right means sharp, centered means in tune.|はじめてのAI音程分析へようこそ。最初の分析をご案内します。§ステップ1：合わせる弦を選びます。内弦はD、外弦はA、自由検出も選べます。§ステップ2：「開始」を押し、マイクの使用を許可します。§ステップ3：長い音を弾きます。針が左なら低く、右なら高く、中央なら正確です。
g_drill|歡迎第一次使用 AI 視譜視唱，我將引導您完成第一次練習。§步驟 1：看看 AI 出的譜。可以按「重新出題」換一首，也能在下方改調式與節奏。§步驟 2：按「開始演奏」，先聽一小節預備拍，再依譜演奏。§步驟 3：演奏時 AI 會即時告訴你在第幾小節、準不準。結束後會看到成績與建議。|Welcome to AI sight-reading for the first time. I will guide you through your first practice.§Step 1: Look at the score. Press New score for another, or change mode and rhythm below.§Step 2: Press Start. You hear one bar of count-in, then play the score.§Step 3: While you play, the AI tells you the current bar and how accurate you are. Afterwards you get results and tips.|はじめてのAI初見演奏へようこそ。最初の練習をご案内します。§ステップ1：AIの譜面を見てみましょう。「新しい問題」で別の曲に替えたり、下で調やリズムを変えたりできます。§ステップ2：「演奏する」を押すと1小節のカウントが鳴るので、そのあと譜面どおりに弾きます。§ステップ3：演奏中、AIが今何小節目か、正確かを教えます。終わると結果とアドバイスが表示されます。

pHead|琴頭§二胡最上面彎曲的部分，常雕成龍頭或簡單的弧形，主要是裝飾。|Head§The curved top of the erhu, often carved like a dragon or a simple scroll; mainly decorative.|琴頭§二胡のいちばん上の曲がった部分。竜の頭などの彫刻もあり、主に装飾です。
pPeg|琴軸§兩根旋轉的木軸，上面那根接內弦、下面那根接外弦。轉緊音變高、轉鬆音變低，用來調音。|Pegs§Two tuning pegs: the upper one holds the inner string, the lower one the outer. Tighten to raise the pitch, loosen to lower it.|糸巻き§2本の糸巻き。上が内弦、下が外弦。締めると音が高く、緩めると低くなります。
pNut|千斤§綁住兩條弦、拉向琴桿的線圈，決定弦可以振動的長度，就像吉他的上弦枕。|Qianjin (nut)§The cord that binds both strings to the neck. It sets the vibrating length, like a guitar nut.|千斤§2本の弦を棹に引き寄せる糸。振動する長さを決めます。
pNeck|琴桿§長長的木桿，左手在這裡按弦。二胡沒有指板，手指直接按在弦上，不碰到琴桿。|Neck§The long wooden rod. The left hand presses the strings here; the erhu has no fingerboard, so fingers press the strings in the air.|棹§長い木の棒。左手で弦を押さえます。指板がないので、弦を空中で押さえます。
pTube|琴筒§六角形的木筒，是二胡的共鳴箱，聲音在這裡放大。|Sound box§The hexagonal wooden tube that resonates and amplifies the sound.|琴筒§六角形の木の筒。共鳴して音を大きくします。
pSkin|琴皮§蒙在琴筒正面的蟒蛇皮，弦的振動透過琴碼傳到琴皮，二胡特有的音色就是這樣來的。|Snakeskin§Python skin stretched over the front of the sound box. String vibrations pass through the bridge into the skin, giving the erhu its unique voice.|蛇皮§琴筒の前に張られたニシキヘビの皮。駒を通して振動が伝わり、二胡独特の音色を生みます。
pBridge|琴碼§琴碼架設於琴弦與琴皮之間，負責傳導琴弦振動，影響二胡音色與共鳴。|Bridge§The bridge sits between the strings and the skin. It carries the strings' vibration and shapes the erhu's tone and resonance.|駒§駒は弦と皮の間に立ち、弦の振動を伝えて、二胡の音色と響きを左右します。
pFelt|墊布§墊布放置於琴碼下方，用來保護琴皮、調整音色，減少雜音與共振。|Felt pad§The felt pad sits below the bridge. It protects the skin, adjusts the tone and cuts down buzzing and unwanted resonance.|フェルト§駒の下に置く布で、皮を守り、音色を整え、雑音や余計な共鳴を抑えます。
pStr|琴弦§兩條金屬弦：內弦（D，較低）和外弦（A，較高）。|Strings§Two metal strings: the inner string (D, lower) and the outer string (A, higher).|弦§2本の金属弦。内弦（D・低い）と外弦（A・高い）。
pBase|琴托§琴筒下方的底座，放在左大腿上，讓二胡站穩。|Base§The block under the sound box that rests on your left thigh and keeps the erhu steady.|琴托§琴筒の下の台座。左ももに置いて二胡を安定させます。
pBow|弓§竹子做的弓桿加上馬尾弓毛。二胡的弓毛夾在兩條弦中間，拿不出來：往外推碰外弦，往內拉碰內弦。|Bow§A bamboo stick with horsehair. The hair runs between the two strings and can't be removed: press outward for the outer string, inward for the inner one.|弓§竹の弓竿と馬の毛。弓毛は2本の弦の間を通っていて外せません。外へ押すと外弦、内へ引くと内弦。

as1|放上琴筒§把琴筒拖到下方的琴托上，蛇皮那一面朝向前方。|Place the drum§Drag the drum onto the stand below, with the snakeskin facing forward.|胴を置く§胴を下の台に運び、蛇皮の面を前に向けます。
as2|插上琴桿§把琴桿拖過來，從上方插進琴筒，琴頭在最上面。|Fit the neck§Drag the neck over and push it down into the drum, with the scroll at the top.|棹を差す§棹を運び、上から胴に差し込みます。頭が一番上です。
as3|裝上弦軸§把兩支弦軸拖到琴桿上方的軸箱，插進軸孔。|Fit the pegs§Drag the two pegs to the peg box at the top of the neck and push them into their holes.|糸巻きを付ける§2本の糸巻きを棹上部の糸倉に運び、穴に差し込みます。
as4|掛上琴弦§把琴弦拖到琴上：弦尾掛在琴筒下方，另一端接到弦軸，內弦接上軸、外弦接下軸。|Fit the strings§Drag the strings onto the erhu: the loop hooks below the drum and the other end goes to the pegs, inner string on the upper peg, outer on the lower.|弦を張る§弦を二胡に運びます。輪は胴の下に掛け、反対側は糸巻きへ。内弦は上、外弦は下の糸巻きです。
as5|轉琴軸把弦調緊§在畫面上上下滑動來轉琴軸。真的二胡要一邊轉、一邊把琴軸往裡推，弦才不會鬆掉。|Tighten the strings§Swipe up and down on the picture to turn the pegs. On a real erhu, push the peg inward as you turn so it holds.|糸巻きで弦を締める§画面を上下にスワイプして糸巻きを回します。実際は回しながら奥へ押し込むと緩みません。
as6|綁上千斤§把千斤拖到琴桿上，它會把兩條弦拉向琴桿。|Tie on the qianjin§Drag the qianjin onto the neck; it pulls both strings toward the neck.|千斤を結ぶ§千斤を棹に運びます。2本の弦を棹側へ引き寄せます。
as7|放上琴碼§把琴碼拖到琴皮上，站正、底部貼平，兩條弦卡在凹槽裡。|Set the bridge§Drag the bridge onto the skin, upright and flat, with the strings in its grooves.|駒を立てる§駒を皮の上に運び、まっすぐ底を密着させ、弦を溝に乗せます。
as8|塞好墊布§把墊布拖到琴碼下方，塞在琴弦和琴皮之間。|Tuck in the felt§Drag the felt pad below the bridge, between the strings and the skin.|フェルトを挟む§フェルトを駒の下、弦と皮の間に運びます。
as9|放進弓§把弓拖到琴上，弓毛要穿在內弦和外弦中間。|Fit the bow§Drag the bow onto the erhu; the hair goes between the inner and outer strings.|弓を通す§弓を二胡に運びます。弓毛は内弦と外弦の間に通します。
as10|幫弓毛上松香§拖著松香，在弓毛上左右來回擦 6 次。|Rosin the bow§Drag the rosin back and forth along the bow hair 6 times.|松脂を塗る§松脂を持って弓毛の上を左右に6回往復させます。
asDone|組裝完成！§你已經把一把二胡組好了，可以到「虛擬二胡」拉拉看。|All built!§You have put a whole erhu together. Try playing it in the virtual erhu.|組み立て完成！§二胡が組み上がりました。「バーチャル二胡」で弾いてみましょう。

h_cam|用相機檢查四件事：弓是否和琴桿保持 90 度、左手臂高度、左手手形是否放鬆、肩膀是否聳起或歪斜。§把手機直立放好、前鏡頭對著自己，按「開啟相機」後會進入全螢幕。擺好標準姿勢按「校準」，倒數後記下你的弓、肩膀與手形。§二胡固定是左手按弦、右手拉弓，程式會自動辨認。琴桿位置是用左手和腰部推估，弓是用右手到琴筒上方的連線推估，所以請讓腰部以上都入鏡。§白色線是琴桿，虛線是和琴桿垂直的目標弓線，粗實線是你現在的弓：綠色代表有保持 90 度，紅色代表歪了。左臂的虛線是手肘的高度上限，手肘在線以下都可以（換到二、三把位手臂較低是正常的），抬得比線高才會變紅；左手骨架變紅代表手指張太開或太僵直；肩膀線變紅代表聳肩或一高一低。§左手應像握著東西般自然彎曲、手指靠攏、肌肉不緊繃。|Checks four things: bow at 90° to the neck, left arm height, relaxed left-hand shape, and raised or uneven shoulders.§Press Start camera; the screen turns to landscape full screen, so stand the phone sideways with the front camera facing you. Hold your best posture and press Calibrate.§Left hand on the strings, right hand bowing, detected automatically. The neck is estimated from your left hand and hip, the bow from your right hand to just above the soundbox, so keep everything above your waist in frame.§The white line is the neck, the dashed line is the target bow line at a right angle, the thick solid line is your bow: green means 90°, red means tilted. The dashed line and circle on the left arm mark the ideal elbow height; a red hand skeleton means spread or stiff fingers; a red shoulder line means raised or uneven shoulders.§The left hand should curve naturally, fingers together, muscles relaxed.|カメラで4つを確認します：弓と棹が90度か、左腕の高さ、左手の形がリラックスしているか、肩が上がったり傾いたりしていないか。§スマホを立てて自撮りカメラを自分に向け、「カメラを開始」を押すと全画面になります。正しい姿勢で「キャリブレーション」を押すと、カウントダウン後に弓・肩・手の形を記録します。§二胡は左手で弦を押さえ、右手で弓を弾くので自動で判別します。棹の位置は左手と腰から、弓は右手から琴筒の上へのラインで推定するので、腰から上を映してください。§白い線が棹、点線が棹と直角の目標の弓の線、太い実線が今の弓です。緑は90度、赤は傾いています。左腕の点線はひじの高さの上限で、線より下なら大丈夫です（第2・第3ポジションで腕が下がるのは正常）。線より上がると赤になります。左手の線が赤いのは指が開きすぎか硬すぎ、肩の線が赤いのは肩が上がっているか左右の高さが違うことを示します。§左手は何かを握るように自然に曲げ、指をそろえ、筋肉の力を抜きます。

function detect(b,sr){const W=1024;let e=0;for(let i=0;i<W;i++)e+=b[i]*b[i];if(Math.sqrt(e/W)<.003)return -1;
 const tMin=Math.max(2,Math.floor(sr/2000)),tMax=Math.min(b.length-W-1,Math.ceil(sr/110)),d=new Float32Array(tMax+2);
 for(let tau=1;tau<=tMax+1;tau++){let s=0;for(let i=0;i<W;i++){const x=b[i]-b[i+tau];s+=x*x}d[tau]=s}
 let run=0;d[0]=1;for(let tau=1;tau<=tMax+1;tau++){run+=d[tau];d[tau]=run>0?d[tau]*tau/run:1}
 let tau=-1;for(let k=tMin;k<=tMax;k++){if(d[k]<.12){while(k+1<=tMax&&d[k+1]<d[k])k++;tau=k;break}}
 if(tau<0){let m=1,mi=-1;for(let k=tMin;k<=tMax;k++)if(d[k]<m){m=d[k];mi=k}if(m<.28)tau=mi;else return -1}
 const x0=d[tau-1],x1=d[tau],x2=d[tau+1],a=x0+x2-2*x1,sh=a>0?(x0-x2)/(2*a):0;return sr/(tau+Math.max(-1,Math.min(1,sh)))}

$('#tkFDone').onclick=()=>{const k=TK&&tkFind(TK.id);if(!k)return;const D=tkDoneMap();if(tkIsDone(k)){delete D[k.id];if(tkSec(k)>=k.min*60)tkLog()[k.id]=k.min*60-1}else{D[k.id]=1;TK.run=false;LH('task',{k:k.k})}tkTouch();save();tkUI()};

const WALK0=[['today','#todayLesson','w1'],['today','#grow','w2'],['course','#courseMap','w3'],['songs','#songCards','w4'],['home','.tiles','w5'],['tune','#gauge','w6'],['drill','#dDemo','w7',1],['me','#meList','w8']];
let WK=0,walkOn=false,walkMode='t';
let WALK=WALK0;
function startWalk(){WALK=WALK0.filter(w=>!(S.role==='student'&&w[0]==='songs')).map(w=>w[1]==='#grow'&&S.role!=='student'?['today','#journey','w2m']:w);walkMode=S.mode||'t';if(stream)mic();if(camOn)stopCam();walkOn=true;WK=0;$('#coach').hidden=true;$('#help').classList.remove('on');$('#tour').classList.remove('on');$('#walk').hidden=false;drawWalk()}
function endWalk(){walkOn=false;S.guided.tune=1;S.guided.drill=1;$('#walk').hidden=true;S.toured=1;save();view(startView())}
function drawWalk(){const [v,,k]=WALK[WK],[ti,de]=t(k).split('§');if(!$('#v-'+v).classList.contains('on'))view(v);
 $('#wStep').textContent=(WK+1)+' / '+WALK.length;$('#wT').textContent=ti;$('#wD').textContent=de;$('#wNext').textContent=t(WK===WALK.length-1?'done':'next');$('#wPrev').hidden=WK===0;$('#wSkip').hidden=WK===WALK.length-1;
 const el=document.querySelector(WALK[WK][1]);if(el&&el.offsetParent!==null&&!el.closest('nav'))el.scrollIntoView({block:'center',behavior:'instant'});
 if(S.read)speak(ti+'。'+de);requestAnimationFrame(()=>requestAnimationFrame(placeWalk))}
function placeWalk(){if(!walkOn)return;const el=document.querySelector(WALK[WK][1]),ring=$('#wRing'),bub=$('#wBub'),W=innerWidth,H=innerHeight,bw=bub.offsetWidth,bh=bub.offsetHeight;
 let r=el&&el.offsetParent!==null?el.getBoundingClientRect():null;if(r&&(r.width===0||r.bottom<0||r.top>H))r=null;
 if(!r){ring.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0`;bub.style.left=Math.max(12,(W-bw)/2)+'px';bub.style.top=Math.max(12,(H-bh)/2)+'px';return}
 const p=6;ring.style.cssText=`left:${r.left-p}px;top:${r.top-p}px;width:${r.width+2*p}px;height:${r.height+2*p}px`;
 const below=r.top+r.height/2<H/2;let top=below?r.bottom+p+12:r.top-p-12-bh;top=Math.max(12,Math.min(H-bh-12,top));
 bub.style.top=top+'px';bub.style.left=Math.max(12,Math.min(W-bw-12,r.left+r.width/2-bw/2))+'px'}
const walkHit=e=>{if(!walkOn||e.target.closest('#wBub'))return 0;const el=document.querySelector(WALK[WK][1]);return el&&(el===e.target||el.contains(e.target))?(WALK[WK][3]?2:1):-1};
document.addEventListener('click',e=>{const h=walkHit(e);if(!h)return;if(h===2){setTimeout(()=>{if(walkOn)$('#wNext').click()},350);return}e.preventDefault();e.stopPropagation();if(h===1)$('#wNext').click()},true);
document.addEventListener('mousedown',e=>{const h=walkHit(e);if(h===1||h===-1)e.preventDefault()},true);
$('#wNext').onclick=()=>{WK<WALK.length-1?(WK++,drawWalk()):endWalk()};$('#wPrev').onclick=()=>{if(WK>0){WK--;drawWalk()}};$('#wSkip').onclick=endWalk;
addEventListener('resize',()=>{if(walkOn)placeWalk()});$('main').addEventListener('scroll',()=>{if(walkOn)placeWalk()},{passive:true});

    {t:'learn',cards:[L_('分清楚內弦和外弦','內弦比較粗、聲音比較低；外弦比較細、聲音比較高。內弦接上方的琴軸，外弦接下方的琴軸。','img:peg'),L_('先換內弦，再換外弦','換弦時先換內弦，裝好之後再換外弦。一次只拆一條，夾在兩條弦中間的弓毛就不會掉出來。','img:bow'),L_('弦尾掛在琴筒下方','弦的一端有小圈，掛在琴筒下方、琴桿底部的掛弦處，另一端往上拉到琴軸。','🪝'),L_('穿過琴軸的小孔再纏繞','弦穿過琴軸上的小孔，一邊轉琴軸一邊把琴軸往裡推，讓它咬緊不會鬆脫，弦要整齊地纏在琴軸上。','🔩'),L_('經過千斤和琴碼，再慢慢調緊','弦要從千斤裡面通過，再架到琴碼上。不要一次轉太緊，之後調音時再慢慢轉到正確的音。','🎯')]},
    {t:'vinst',h:'虛擬安裝：把內弦和外弦裝上去',p:'用手機主鏡頭對著桌面，左手拿手機、右手操作。照著引導先裝內弦、再裝外弦，最後轉兩下琴軸，就算挑戰成功。'},
    {t:'self',h:'照著步驟把兩條弦裝好',p:'裝好後用手指輕輕撥一下，內弦比外弦低，就代表裝對了。'}]},
   {id:'ins2',title:'千斤',gain:'知道千斤的作用和正確的綁法',steps:[
    {t:'learn',cards:[L_('千斤是什麼','千斤是綁在琴桿上的線，把兩條弦拉向琴桿。千斤到琴碼之間，就是弦能振動的長度。','img:erhu'),L_('弦和琴桿的距離','千斤處的弦和琴桿大約相距 1.5 到 2 公分。太遠按弦會很吃力，太近手指容易碰到琴桿。','📏'),L_('綁法：先繞琴桿，再勾住琴弦','千斤線先在琴桿上繞好，再往前勾住內外兩條弦拉向琴桿，重複幾次並排整齊，最後打結固定。','🧵'),L_('千斤的高低會改變音高','千斤往下移，弦變短，音會變高；往上移，弦變長，音會變低。位置確定後就不要常常移動。','↕️')]},
    {t:'vinst',mode:'nut',h:'虛擬安裝：綁上千斤',p:'用手機主鏡頭對著桌面，左手拿手機、右手操作。先把千斤線移到千斤的位置，再繞圈 3 秒，就完成安裝。'},
    {t:'self',h:'檢查你的千斤',p:'看看千斤有沒有綁緊，兩條弦有沒有一起被拉向琴桿。'}]},
   {id:'ins3',title:'琴碼',gain:'把琴碼放在正確的位置',steps:[
    {t:'learn',cards:[L_('琴碼的作用','琴碼架設於琴弦與琴皮之間，負責傳導琴弦振動，影響二胡音色與共鳴。','🎵'),L_('放在琴皮中間附近','琴碼通常放在琴皮中間附近，可以上下微調，找出聲音最好聽的位置。','🎯'),L_('站正、底部貼平','琴碼要站直不要歪，底部整個貼在琴皮上，兩條弦分別卡在琴碼上方的凹槽裡。','📐'),L_('調完音再檢查一次','把弦轉緊時琴碼可能被拉歪，調完音要再看一次琴碼有沒有站正。','🔁')]},
    {t:'self',h:'檢查你的琴碼',p:'確認琴碼站正、底部貼平，兩條弦都卡在凹槽裡。'}]},
   {id:'ins4',title:'墊布',gain:'知道墊布的作用和放法',steps:[
    {t:'learn',cards:[L_('墊布的作用','墊布放置於琴碼下方，用來保護琴皮、調整音色，減少雜音與共振。','🧽'),L_('放在琴碼下方','把墊布折好，塞在琴碼下方、琴弦和琴皮之間，輕輕碰到琴皮就好。','📍'),L_('鬆緊會改變聲音','墊布塞太緊，聲音會變悶；太鬆或沒有墊布，容易出現沙沙的雜音。','🔊')]},
    {t:'self',h:'放好你的墊布',p:'放好後用手指撥一下空弦，聽聽聲音是不是乾淨、沒有雜音。'}]},
   {id:'ins5',title:'弓',gain:'認識弓的構造，學會保護它',steps:[
    {t:'learn',cards:[L_('弓的構造','弓由弓桿和弓毛組成，弓毛是馬尾毛。手握的那一端叫弓根，另一端叫弓尖。','img:bow'),L_('弓毛夾在兩弦之間','二胡的弓毛一直夾在內弦和外弦中間，不能拿出來。拉內弦時弓毛貼內弦，拉外弦時貼外弦。','↔️'),L_('不要用手摸弓毛','手上的油會讓弓毛打滑、拉不出聲音，拿弓時只碰弓桿和弓根。','✋'),L_('弓毛的鬆緊','二胡的弓毛鬆緊是靠右手中指和無名指撐開來控制，弓毛本身不需要調得很緊。','🤏')]},
    {t:'self',h:'拿起你的弓看一看',p:'找到弓根、弓尖和弓毛，確認弓毛有夾在兩條弦中間。'}]},
   {id:'ins6',title:'如何上松香',gain:'幫弓毛上好松香',steps:[
    {t:'learn',cards:[L_('為什麼要上松香','松香讓弓毛和琴弦之間產生摩擦，拉的時候才會發出聲音。沒有松香，弓毛會滑過去，拉不出聲音。','img:bow'),L_('拿松香在弓毛上來回擦','二胡的弓毛夾在弦中間，所以是拿著松香，在弓毛上從弓根到弓尖來回擦，力道要平均。','🧴'),L_('新弓要多擦一些','新的弓毛要擦比較久，直到弓毛上有一層薄薄的白色粉末；平常練琴前擦幾下就夠了。','✨'),L_('擦掉多餘的粉','琴弦、琴皮和琴筒上的松香粉要用軟布擦乾淨，松香太多聲音會變粗。','🧹')]},
    {t:'self',h:'幫你的弓上松香',p:'從弓根到弓尖平均地擦，看到弓毛上有薄薄一層白色粉末就好了。'}]}]},
  {u:'第二階段・認識二胡',days:'1～15',ls:[
   {id:'b1',title:'認識你的二胡',gain:'認識二胡的內弦與外弦',steps:[
    {t:'learn',sim:1,fig:[['erhu','figErhu'],['bow','figBow']],cards:[L_('二胡只有兩條弦','靠近你的是內弦，聲音比較低沉；外面那條是外弦，聲音比較明亮。','img:erhu'),L_('弓毛夾在兩弦中間','拉內弦時弓毛貼著內弦，拉外弦時貼著外弦，弓不用拿出來。','img:bow'),L_('上方的琴軸用來調音','轉動琴軸會讓弦變緊或變鬆，聲音也跟著變高或變低。','img:peg')]},
    {t:'self',h:'把二胡拿出來，找到內弦和外弦',p:'用手指輕輕撥一下兩條弦，聽聽哪條比較低、哪條比較高。'}]},
   {id:'b2',title:'坐好、拿好琴',gain:'放鬆地坐好、拿好琴',steps:[
    {t:'learn',cards:[L_('坐椅子的前半部','雙腳平放在地上，背挺直但不要僵硬。','🪑'),L_('琴筒放在左腿上','琴筒穩穩放在左大腿靠近腰的地方，琴桿微微往左前方傾斜。','img:erhu'),L_('肩膀放鬆','肩膀自然往下垂，不要聳起來，手才拉得久。','😌')]},
    {t:'cam',need:['sh'],hold:5,h:'肩膀放鬆，維持 5 秒',p:'把手機立在前方約 1 公尺，讓上半身入鏡。肩膀線變綠就代表放鬆了。'}]},
   {id:'b3',title:'如何正確持弓',gain:'用正確的手形握住弓',steps:[
    {t:'learn',fig:[['grip1','figGrip1'],['grip2','figGrip2']],cards:[L_('先做握弓準備動作','右手的中指和無名指往掌心彎，大拇指、食指、小指放鬆伸直（左圖）。','img:grip1'),L_('大拇指和食指夾住弓桿','食指彎起來托住弓桿，大拇指指腹輕輕壓在弓桿上，靠近食指第二節。','img:grip2'),L_('中指、無名指勾住弓毛','兩根手指放在弓桿和弓毛中間，用指尖輕輕把弓毛往外推，拉琴的力量就從這裡來。','✋'),L_('手腕和手指都要放鬆','握弓像拿一枝筆，不用握緊。手會痠就代表太用力了。','😌')]},
    {t:'grip',h:'跟著鏡頭的引導握好弓',p:'不用拉琴。第 1 步用自拍鏡頭，把右手手心對著鏡頭做出握弓手形；第 2 步會自動換成後鏡頭，用左手拿手機拍握著弓的右手。'}]},
   {id:'b3b',title:'如何正確運弓',gain:'用正確的運弓動作，讓弓和琴桿保持 90 度',steps:[
    {t:'learn',vid:'bow_demo.mp4',cards:[L_('先做運弓暖身','先不要拿琴和弓。右手做出握弓的準備動作，手臂放鬆，像拿著弓一樣在空中左右推拉。','✋'),L_('手腕帶著手走','往外拉的時候手腕先走、手掌跟在後面；往內推的時候手腕先往內收，手掌再跟上，手腕要像彈簧一樣放鬆。','〰️'),L_('走一直線','推拉的路線要平直，不要畫成弧線，速度保持平均。','📏'),L_('用左手拿手機','把手機拿在左手，後鏡頭從上方對著右手，就能看到引導線。','📱')]},
    {t:'stroke',n:8,h:'運弓暖身：在空中推拉 8 次',p:'先不要拿琴。左手拿手機，用後鏡頭從上方拍右手，跟著引導線平直地推拉。'},
    {t:'cam',need:['bow'],hold:2,virt:1,h:'拿起琴和弓，弓和琴桿保持 90 度 2 秒',p:'手機會自動換回自拍鏡頭。把手機立在前方約 1 公尺，讓上半身和琴入鏡，畫面上的弓線變綠就對了。'}]},
   {id:'b4',title:'拉響內弦',gain:'拉響內弦空弦（Do）',steps:[
    {t:'learn',cards:[L_('空弦就是不按任何手指','拉內弦的空弦，就是簡譜的 1，也就是 Do。','🎵'),L_('慢慢拉、力量平均','弓速慢一點，從頭到尾力量一樣，聲音會比較穩。','🐢')]},
    {t:'tune',s:'D',hold:2,h:'拉內弦空弦，讓指針停在綠色區 2 秒',p:'如果一直偏高或偏低，先轉上方的琴軸把弦調準。'}]},
   {id:'b5',title:'拉響外弦',gain:'拉響外弦空弦（Sol）',steps:[
    {t:'learn',cards:[L_('外弦空弦是 5','外弦不按手指，就是簡譜的 5，也就是 Sol。','🎵'),L_('換弦只要轉一點點','手腕輕輕往外推，弓毛就會貼到外弦。','↔️')]},
    {t:'tune',s:'A',hold:2,h:'拉外弦空弦，讓指針停在綠色區 2 秒',p:'聲音穩了再看指針，不用急。'}]},
   {id:'b5m',title:'空弦小旋律',gain:'用兩條空弦拉出一段旋律',steps:[
    {t:'learn',cards:[L_('只用兩個音也能成曲','1 是內弦、5 是外弦，跟著譜換弦就是一段旋律。','🎶')]},
    {t:'song',song:'open15',tempo:60,pass:50,h:'拉「1 – 1 – 5 – 5 –」',p:'先按「示範演奏」聽一次，再按「開始演奏」。'}]}]},
  {u:'第三階段・基本運弓',days:'16～30',ls:[
   {id:'b6',title:'長弓：數到四',gain:'一弓拉滿 4 拍的長弓',steps:[
    {t:'learn',cards:[L_('一弓拉 4 拍','跟著節拍器心裡數 1、2、3、4，一個方向拉完再換方向。','⏱'),L_('聲音要一樣大','開頭、中間、結尾的聲音都一樣大，就是好的長弓。','📏')]},
    {t:'beat',bpm:60,beats:4,count:16,h:'跟著節拍拉 4 個來回（16 拍）',p:'推弓 4 拍、拉弓 4 拍，重複兩次。'},
    {t:'self',h:'聲音有沒有一直很平穩？',p:'如果有斷掉或忽大忽小，可以再練一次，或者先往下走。'}]},
   {id:'b6s',title:'短弓',gain:'一拍一弓的短弓',steps:[
    {t:'learn',cards:[L_('一拍換一次弓','用弓的中段，推一拍、拉一拍，弓不用拉很長。','✂️'),L_('換弓要乾淨','換方向時聲音不要斷，也不要有雜音。','✨')]},
    {t:'beat',bpm:72,beats:4,count:16,h:'跟著節拍，一拍一弓拉 16 下',p:'用內弦空弦就好。'}]},
   {id:'b6p',title:'弓速與弓壓',gain:'用弓速和弓壓控制聲音',steps:[
    {t:'learn',cards:[L_('弓速','弓拉得快聲音比較亮，拉得慢聲音比較集中。','🏃'),L_('弓壓','手臂的重量自然放在弓上，壓太重會刮、太輕會虛。','⚖️')]},
    {t:'beat',bpm:60,beats:4,count:16,h:'4 拍長弓：前兩拍輕、後兩拍重（16 拍）',p:'仔細聽聲音的變化。'},
    {t:'self',h:'聽得出聲音的變化嗎？',p:'只要聽得出來就很棒了。'}]},
   {id:'b6r',title:'空弦節奏',gain:'在空弦上拉出節奏',steps:[
    {t:'song',song:'openRhythm',tempo:66,pass:55,h:'拉一段空弦節奏',p:'四分音符拉短弓，長音拉長弓。'}]}]},
  {u:'第四階段・左手指法',days:'31～45',ls:[
   {id:'b7',title:'認識簡譜',gain:'看懂簡譜 1 2 3',steps:[
    {t:'learn',cards:[L_('數字就是音','1 2 3 4 5 6 7 就是 Do Re Mi Fa Sol La Si，不用學五線譜也能拉。','🔢'),L_('橫線讓音變長','「1 –」拉兩拍，「1 – – –」拉四拍。','➖')]},
    {t:'song',song:'abc',tempo:60,pass:50,h:'先聽示範，再拉「1 2 3 – 3 2 1 –」',p:'按「示範演奏」聽一次，再按「開始演奏」跟著拉。'}]},
   {id:'b7f',title:'四個手指',gain:'用四個手指拉出 D 調音階',steps:[
    {t:'learn',cards:[L_('內弦的手指','空弦 1、食指 2、中指 3、無名指 4。','👆'),L_('外弦的手指','空弦 5、食指 6、中指 7、無名指 1（高音 Do）。','☝️'),L_('手指自然彎曲','用指尖按弦，手像握著一顆小球。','✋')]},
    {t:'cam',need:['lh'],hold:5,h:'左手手形保持放鬆 5 秒',p:'按著弦時看看左手骨架是不是綠色。'},
    {t:'song',song:'dscale',tempo:60,pass:55,h:'拉一次 D 調音階（上行再下行）',p:'每個音都慢慢拉、聽準了再換。'}]},
   {id:'b8',title:'第一段旋律',gain:'拉出小蜜蜂的第一段',steps:[
    {t:'learn',cards:[L_('先聽再拉','每一首新的旋律，都先按「示範演奏」聽一次。','👂'),L_('跟著亮起來的音','演奏時，現在該拉的音會亮起來，跟著它走就好。','✨')]},
    {t:'song',song:'bee4',tempo:60,pass:55,h:'拉出小蜜蜂的前四小節',p:'音準和節奏都達到 55% 就過關。'}]}]},
  {u:'第五階段・第一首歌',days:'46～60',ls:[
   {id:'b9',title:'小蜜蜂',gain:'完整拉完一首小蜜蜂',steps:[
    {t:'learn',cards:[L_('樂句就像一句話','每兩小節是一句，一句結束時可以輕輕換氣。','💬')]},
    {t:'song',song:'bee',tempo:66,pass:60,h:'完整拉完小蜜蜂',p:'這是你的第一首完整的歌！'}]},
   {id:'b10',title:'小星星',gain:'拉完小星星',steps:[
    {t:'learn',cards:[L_('6 要用外弦食指','外弦空弦是 5，食指按下去就是 6。','🌟')]},
    {t:'song',song:'twinkle',tempo:72,pass:65,h:'拉完小星星',p:'音準和節奏都達到 65% 就過關。'}]},
   {id:'b11',title:'瑪莉有隻小綿羊',gain:'拉完瑪莉有隻小綿羊',steps:[{t:'song',song:'mary',tempo:72,pass:65,h:'拉完瑪莉有隻小綿羊',p:'注意第二行有連續四個 3。'}]}]},
  {u:'第六階段・音樂表情',days:'61～75',ls:[
   {id:'b12d',title:'強弱變化',gain:'拉出強弱變化',steps:[
    {t:'learn',cards:[L_('p 是弱、f 是強','譜上的 p、mp、mf、f，從最小聲到最大聲。','🔊'),L_('靠弓壓和弓速','大聲時弓多一點重量、速度快一點；小聲時反過來。','⚖️')]},
    {t:'beat',bpm:60,beats:4,count:16,h:'4 拍一弓：一弓小聲、一弓大聲（16 拍）',p:'用內弦或外弦都可以。'}]},
   {id:'b12c',title:'換弦與換弓',gain:'流暢地換弦與換弓',steps:[
    {t:'learn',cards:[L_('換弦用手腕','手腕輕輕轉，弓毛就從內弦到外弦。','↔️'),L_('換弓不斷音','換方向前稍微放慢，聲音就會連在一起。','🔁')]},
    {t:'beat',bpm:60,beats:2,count:16,h:'內外弦交替，每 2 拍換一次（16 拍）',p:''}]},
   {id:'b12',title:'歡樂頌',gain:'拉完歡樂頌，學會附點節奏',steps:[
    {t:'learn',cards:[L_('附點讓音變長一半','「3.」比「3」長一半，後面的「2」就短一點，像「噠－嗒」。','•')]},
    {t:'song',song:'ode',tempo:72,pass:70,h:'拉完歡樂頌',p:'先聽示範，特別注意附點的長短。'}]},
   {id:'b13',title:'揉弦入門',gain:'學會揉弦的基本動作',steps:[
    {t:'learn',cards:[L_('揉弦讓聲音有感情','按弦的手指上下輕輕滾動，讓音高微微起伏。','🌊'),L_('先慢後快','先一拍揉兩下，熟了再慢慢加快。','🐌')]},
    {t:'beat',bpm:60,beats:4,count:16,h:'跟著節拍，一拍揉兩下（16 拍）',p:'用中指按住 3，手腕放鬆跟著節拍揉。'},
    {t:'self',h:'手腕和肩膀有沒有放鬆？',p:'揉弦時肩膀也要放鬆喔。'}]},
   {id:'b14',title:'送別',gain:'拉完送別，用上揉弦',steps:[{t:'song',song:'songbie',tempo:66,pass:70,h:'拉完送別',p:'長音的地方試試加上揉弦。'}]}]},
  {u:'第七階段・個人演奏',days:'76～90',ls:[
   {id:'b15',title:'茉莉花',gain:'拉完茉莉花',steps:[{t:'song',song:'jasmine',tempo:60,pass:70,h:'拉完茉莉花',p:'這首會用到高音 1，慢慢來。'}]},
   {id:'b16',title:'我的第一場演奏',gain:'完成第一段完整的演奏',steps:[

const TRC={"空弦小旋律": ["Open-string tune", "開放弦のメロディー"], "空弦節奏": ["Open-string rhythm", "開放弦のリズム"], "D 調音階": ["D major scale", "D調の音階"], "小蜜蜂（前段）": ["Little Bee (opening)", "小さなミツバチ（前半）"], "小蜜蜂": ["Little Bee", "小さなミツバチ"], "德國兒歌改編，只用到 1 到 5，最適合當第一首歌。": ["A German children's song using only 1 to 5, ideal as a first song.", "ドイツの童謡。1から5だけで弾けるので、最初の1曲にぴったり。"], "小星星": ["Twinkle Twinkle", "きらきら星"], "大家都會哼的〈小星星〉，加入外弦的 6。": ["The tune everyone can hum, adding 6 on the outer string.", "だれもが口ずさめる曲。外弦の6が加わります。"], "瑪莉有隻小綿羊": ["Mary Had a Little Lamb", "メリーさんのひつじ"], "美國兒歌，節奏平穩，練習連續的同音。": ["An American children's song with a steady rhythm; practice repeated notes.", "アメリカの童謡。安定したリズムで、同じ音の連続を練習します。"], "歡樂頌": ["Ode to Joy", "歓喜の歌"], "貝多芬第九號交響曲的主題，練習附點節奏。": ["The theme from Beethoven's Ninth Symphony; practice dotted rhythms.", "ベートーヴェン第九の主題。付点リズムを練習します。"], "送別": ["Farewell (Songbie)", "送別"], "旋律來自美國作曲家奧德威，在華人世界廣為傳唱，適合練揉弦。": ["A melody by the American composer J. P. Ordway, widely sung in the Chinese-speaking world; good for vibrato.", "アメリカの作曲家オードウェイの旋律。中華圏で広く歌われ、ビブラートの練習に最適。"], "茉莉花": ["Jasmine Flower", "茉莉花（ジャスミン）"], "江蘇民歌，最具代表性的中國民歌之一。": ["A folk song from Jiangsu, one of the best-known Chinese folk songs.", "江蘇省の民謡。もっとも有名な中国民謡のひとつ。"], "認識你的二胡": ["Meet your erhu", "二胡を知ろう"], "認識二胡的內弦與外弦": ["Know the inner and outer strings", "内弦と外弦がわかる"], "二胡只有兩條弦": ["The erhu has only two strings", "二胡の弦は2本だけ"], "靠近你的是內弦，聲音比較低沉；外面那條是外弦，聲音比較明亮。": ["The string nearer you is the inner string, with a deeper sound; the other is the outer string, which sounds brighter.", "体に近いほうが内弦で低く深い音、外側が外弦で明るい音です。"], "弓毛夾在兩弦中間": ["The bow hair sits between the strings", "弓の毛は2本の弦の間にある"], "拉內弦時弓毛貼著內弦，拉外弦時貼著外弦，弓不用拿出來。": ["The hair touches the inner string for inner notes and the outer string for outer notes. The bow never comes out.", "内弦を弾くときは毛を内弦に、外弦のときは外弦に当てます。弓は抜きません。"], "上方的琴軸用來調音": ["The pegs at the top tune the strings", "上の糸巻きで調弦する"], "轉動琴軸會讓弦變緊或變鬆，聲音也跟著變高或變低。": ["Turning a peg tightens or loosens the string, raising or lowering the pitch.", "糸巻きを回すと弦が張ったり緩んだりして、音が高くなったり低くなったりします。"], "把二胡拿出來，找到內弦和外弦": ["Take out your erhu and find the inner and outer strings", "二胡を出して、内弦と外弦を見つけよう"], "用手指輕輕撥一下兩條弦，聽聽哪條比較低、哪條比較高。": ["Pluck both strings gently and hear which is lower and which is higher.", "指で2本の弦を軽くはじいて、どちらが低くどちらが高いか聴いてみましょう。"], "坐好、拿好琴": ["Sit well, hold the erhu", "正しく座って構える"], "放鬆地坐好、拿好琴": ["Sit relaxed and hold the erhu", "リラックスして座り、二胡を構える"], "坐椅子的前半部": ["Sit on the front half of the chair", "椅子の前半分に座る"], "雙腳平放在地上，背挺直但不要僵硬。": ["Feet flat on the floor, back straight but not stiff.", "両足を床につけ、背筋を伸ばしますが固くならないように。"], "琴筒放在左腿上": ["Soundbox on your left thigh", "琴筒を左ももに置く"], "琴筒穩穩放在左大腿靠近腰的地方，琴桿微微往左前方傾斜。": ["Rest the soundbox on your left thigh near the hip, with the neck leaning slightly forward and left.", "琴筒を左ももの付け根あたりに安定させ、棹をやや左前に傾けます。"], "肩膀放鬆": ["Relax your shoulders", "肩の力を抜く"], "肩膀自然往下垂，不要聳起來，手才拉得久。": ["Let your shoulders drop naturally. Don't raise them, so you can play longer.", "肩は自然に下ろし、上げないように。長く弾けるようになります。"], "肩膀放鬆，維持 5 秒": ["Keep your shoulders relaxed for 5 seconds", "肩の力を抜いて5秒キープ"], "把手機立在前方約 1 公尺，讓上半身入鏡。肩膀線變綠就代表放鬆了。": ["Stand the phone about 1 m in front of you with your upper body in view. A green shoulder line means relaxed.", "スマホを約1m前に立て、上半身を映します。肩の線が緑ならリラックスできています。"], "如何正確持弓": ["How to hold the bow", "正しい弓の持ち方"], "用正確的手形握住弓": ["Hold the bow with the correct hand shape", "正しい手の形で弓を持つ"], "先做握弓準備動作": ["Start with the ready shape", "まず弓を持つ準備の形"], "右手的中指和無名指往掌心彎，大拇指、食指、小指放鬆伸直（左圖）。": ["Curl your right middle and ring fingers toward the palm; keep thumb, index and little finger relaxed and straight (left photo).", "右手の中指と薬指を手のひらへ曲げ、親指・人差し指・小指は力を抜いて伸ばします（左の写真）。"], "大拇指和食指夾住弓桿": ["Thumb and index hold the stick", "親指と人差し指で弓竿をはさむ"], "食指彎起來托住弓桿，大拇指指腹輕輕壓在弓桿上，靠近食指第二節。": ["Curl the index finger under the stick and rest the pad of your thumb on the stick near the index finger's second joint.", "人差し指を曲げて弓竿を支え、親指の腹を人差し指の第二関節あたりで弓竿に軽くのせます。"], "中指、無名指勾住弓毛": ["Middle and ring fingers hook the hair", "中指と薬指で弓毛を引っかける"], "兩根手指放在弓桿和弓毛中間，用指尖輕輕把弓毛往外推，拉琴的力量就從這裡來。": ["Place both fingers between the stick and the hair and push the hair outward gently with the fingertips. Your bowing power comes from here.", "2本の指を弓竿と弓毛の間に入れ、指先で毛を軽く外へ押します。弾く力はここから生まれます。"], "手腕和手指都要放鬆": ["Keep wrist and fingers relaxed", "手首も指もリラックス"], "握弓像拿一枝筆，不用握緊。手會痠就代表太用力了。": ["Hold the bow like a pen, without squeezing. If your hand aches, you are gripping too hard.", "ペンを持つように、握りしめません。手が疲れるのは力の入れすぎです。"], "跟著鏡頭的引導握好弓": ["Follow the camera guide to hold the bow", "カメラのガイドに合わせて弓を持つ"], "不用拉琴。第 1 步用自拍鏡頭，把右手手心對著鏡頭做出握弓手形；第 2 步會自動換成後鏡頭，用左手拿手機拍握著弓的右手。": ["No playing needed. Step 1 uses the front camera: show your right palm and make the ready shape. Step 2 switches to the rear camera automatically: hold the phone in your left hand and film your right hand holding the bow.", "弾く必要はありません。ステップ1は自撮りカメラで、右の手のひらを向けて準備の形を作ります。ステップ2は自動で背面カメラに切り替わり、左手でスマホを持って弓を持つ右手を映します。"], "如何正確運弓": ["How to move the bow", "正しい運弓"], "用正確的運弓動作，讓弓和琴桿保持 90 度": ["Bow with the right motion, keeping the bow at 90° to the neck", "正しい動きで運弓し、弓と棹を90度に保つ"], "先做運弓暖身": ["Bowing warm-up first", "まず運弓のウォームアップ"], "先不要拿琴和弓。右手做出握弓的準備動作，手臂放鬆，像拿著弓一樣在空中左右推拉。": ["Put the erhu and bow aside. Make the ready shape with your right hand, relax the arm, and push and pull in the air as if holding a bow.", "二胡と弓は置いたまま。右手で準備の形を作り、腕の力を抜いて、弓を持っているつもりで空中を左右に動かします。"], "手腕帶著手走": ["Let the wrist lead the hand", "手首が手をリードする"], "往外拉的時候手腕先走、手掌跟在後面；往內推的時候手腕先往內收，手掌再跟上，手腕要像彈簧一樣放鬆。": ["Pulling out, the wrist goes first and the hand follows; pushing in, the wrist folds in first and the hand follows. Keep the wrist loose like a spring.", "引くときは手首が先で手のひらが後から、押すときは手首を先に内へ入れて手が続きます。手首はバネのようにやわらかく。"], "走一直線": ["Move in a straight line", "まっすぐ動かす"], "推拉的路線要平直，不要畫成弧線，速度保持平均。": ["Keep the path flat and straight, not an arc, at an even speed.", "軌道は弧を描かず水平にまっすぐ、速さは一定に。"], "用左手拿手機": ["Hold the phone in your left hand", "左手でスマホを持つ"], "把手機拿在左手，後鏡頭從上方對著右手，就能看到引導線。": ["Hold the phone in your left hand and point the rear camera down at your right hand to see the guide lines.", "左手でスマホを持ち、背面カメラを上から右手に向けるとガイド線が見えます。"], "運弓暖身：在空中推拉 8 次": ["Bowing warm-up: 8 strokes in the air", "運弓ウォームアップ：空中で8回"], "先不要拿琴。左手拿手機，用後鏡頭從上方拍右手，跟著引導線平直地推拉。": ["No erhu yet. Hold the phone in your left hand, film your right hand from above with the rear camera, and move straight along the guide line.", "二胡はまだ持ちません。左手でスマホを持ち、背面カメラで上から右手を映して、ガイド線に沿ってまっすぐ動かします。"], "拿起琴和弓，弓和琴桿保持 90 度 2 秒": ["Pick up the erhu and bow; keep the bow at 90° to the neck for 2 seconds", "二胡と弓を持ち、弓と棹を90度で2秒キープ"], "手機會自動換回自拍鏡頭。把手機立在前方約 1 公尺，讓上半身和琴入鏡，畫面上的弓線變綠就對了。": ["The phone switches back to the front camera. Stand it about 1 m away with your upper body and erhu in view. A green bow line means correct.", "自動で自撮りカメラに戻ります。スマホを約1m前に立てて上半身と二胡を映し、弓の線が緑になれば正解です。"], "拉響內弦": ["Sound the inner string", "内弦を鳴らす"], "拉響內弦空弦（Do）": ["Play the open inner string (Do)", "内弦の開放弦（ド）を鳴らす"], "空弦就是不按任何手指": ["Open string means no fingers down", "開放弦は指を押さえない"], "拉內弦的空弦，就是簡譜的 1，也就是 Do。": ["The open inner string is 1 in jianpu, that is Do.", "内弦の開放弦は数字譜の1、つまりドです。"], "慢慢拉、力量平均": ["Slow bow, even weight", "ゆっくり、均等な力で"], "弓速慢一點，從頭到尾力量一樣，聲音會比較穩。": ["Bow slowly with the same weight from start to end for a steadier tone.", "弓をゆっくり、最初から最後まで同じ力で動かすと音が安定します。"], "拉內弦空弦，讓指針停在綠色區 2 秒": ["Play the open inner string and hold the needle in the green for 2 seconds", "内弦の開放弦を弾き、針を緑のゾーンに2秒"], "如果一直偏高或偏低，先轉上方的琴軸把弦調準。": ["If it stays sharp or flat, tune the string with the peg first.", "ずっと高い・低いときは、先に糸巻きで調弦しましょう。"], "拉響外弦": ["Sound the outer string", "外弦を鳴らす"], "拉響外弦空弦（Sol）": ["Play the open outer string (Sol)", "外弦の開放弦（ソ）を鳴らす"], "外弦空弦是 5": ["The open outer string is 5", "外弦の開放弦は5"], "外弦不按手指，就是簡譜的 5，也就是 Sol。": ["The outer string with no fingers is 5 in jianpu, that is Sol.", "外弦を押さえずに弾くと数字譜の5、つまりソです。"], "換弦只要轉一點點": ["Crossing strings takes a tiny turn", "移弦はほんの少しの動き"], "手腕輕輕往外推，弓毛就會貼到外弦。": ["Push the wrist out gently and the hair meets the outer string.", "手首を軽く外へ押すと、弓毛が外弦に当たります。"], "拉外弦空弦，讓指針停在綠色區 2 秒": ["Play the open outer string and hold the needle in the green for 2 seconds", "外弦の開放弦を弾き、針を緑のゾーンに2秒"], "聲音穩了再看指針，不用急。": ["Get a steady tone first, then check the needle. No rush.", "音が安定してから針を見ましょう。あせらずに。"], "用兩條空弦拉出一段旋律": ["Play a tune on the two open strings", "2本の開放弦でメロディーを弾く"], "只用兩個音也能成曲": ["Two notes can make music", "2つの音でも曲になる"], "1 是內弦、5 是外弦，跟著譜換弦就是一段旋律。": ["1 is the inner string, 5 is the outer. Follow the score across the strings and you have a tune.", "1は内弦、5は外弦。楽譜どおりに弦を替えればメロディーになります。"], "拉「1 – 1 – 5 – 5 –」": ["Play \"1 – 1 – 5 – 5 –\"", "「1 – 1 – 5 – 5 –」を弾く"], "先按「示範演奏」聽一次，再按「開始演奏」。": ["Press Demo to listen once, then press Play.", "まず「模範演奏」で聴いてから「演奏する」を押しましょう。"], "長弓：數到四": ["Long bows: count to four", "長弓：4つ数える"], "一弓拉滿 4 拍的長弓": ["A full long bow lasting 4 beats", "4拍分の長弓を弾く"], "一弓拉 4 拍": ["One bow for 4 beats", "1弓で4拍"], "跟著節拍器心裡數 1、2、3、4，一個方向拉完再換方向。": ["Count 1, 2, 3, 4 with the metronome, finish one direction, then change.", "メトロノームに合わせて心の中で1・2・3・4。片方向を弾ききってから返します。"], "聲音要一樣大": ["Keep the sound even", "音量を一定に"], "開頭、中間、結尾的聲音都一樣大，就是好的長弓。": ["A good long bow is equally loud at the start, middle and end.", "弾きはじめ・中間・終わりの音量が同じなら良い長弓です。"], "跟著節拍拉 4 個來回（16 拍）": ["Play 4 round trips with the beat (16 beats)", "拍に合わせて4往復（16拍）"], "推弓 4 拍、拉弓 4 拍，重複兩次。": ["Push 4 beats, pull 4 beats, twice.", "押し弓4拍、引き弓4拍を2回くり返します。"], "聲音有沒有一直很平穩？": ["Was the sound steady throughout?", "音はずっと安定していましたか？"], "如果有斷掉或忽大忽小，可以再練一次，或者先往下走。": ["If it broke or wavered, try again, or move on for now.", "途切れたり大きさが変わったりしたら、もう一度。先に進んでもかまいません。"], "短弓": ["Short bows", "短弓"], "一拍一弓的短弓": ["Short bows, one per beat", "1拍1弓の短弓"], "一拍換一次弓": ["Change bow every beat", "1拍ごとに弓を返す"], "用弓的中段，推一拍、拉一拍，弓不用拉很長。": ["Use the middle of the bow: push one beat, pull one beat. No need for long strokes.", "弓の中央を使い、1拍押して1拍引きます。長く使う必要はありません。"], "換弓要乾淨": ["Clean bow changes", "弓の返しをきれいに"], "換方向時聲音不要斷，也不要有雜音。": ["No gap and no scratch when you change direction.", "返すときに音が途切れたり、雑音が出たりしないように。"], "跟著節拍，一拍一弓拉 16 下": ["With the beat, 16 strokes, one per beat", "拍に合わせて1拍1弓で16回"], "用內弦空弦就好。": ["The open inner string is fine.", "内弦の開放弦でOKです。"], "弓速與弓壓": ["Bow speed and weight", "弓の速さと圧力"], "用弓速和弓壓控制聲音": ["Control the sound with bow speed and weight", "弓の速さと圧力で音をコントロール"], "弓速": ["Bow speed", "弓の速さ"], "弓拉得快聲音比較亮，拉得慢聲音比較集中。": ["A fast bow sounds brighter; a slow bow sounds more focused.", "速い弓は明るい音、遅い弓は芯のある音になります。"], "弓壓": ["Bow weight", "弓の圧力"], "手臂的重量自然放在弓上，壓太重會刮、太輕會虛。": ["Let the arm's weight rest on the bow. Too heavy scratches; too light sounds thin.", "腕の重さを自然に弓にのせます。重すぎると雑音、軽すぎるとかすれます。"], "4 拍長弓：前兩拍輕、後兩拍重（16 拍）": ["4-beat long bows: first two beats light, last two heavy (16 beats)", "4拍の長弓：前2拍は軽く、後2拍は重く（16拍）"], "仔細聽聲音的變化。": ["Listen closely to how the sound changes.", "音の変化をよく聴きましょう。"], "聽得出聲音的變化嗎？": ["Can you hear the sound change?", "音の変化が聴きとれますか？"], "只要聽得出來就很棒了。": ["If you can hear it, that is great.", "聴きとれれば十分です。"], "在空弦上拉出節奏": ["Play rhythms on open strings", "開放弦でリズムを弾く"], "拉一段空弦節奏": ["Play an open-string rhythm", "開放弦のリズムを弾く"], "四分音符拉短弓，長音拉長弓。": ["Short bows for quarter notes, long bows for long notes.", "四分音符は短弓、長い音は長弓で。"], "認識簡譜": ["Reading jianpu", "数字譜を知る"], "看懂簡譜 1 2 3": ["Read 1 2 3 in jianpu", "数字譜の1 2 3が読める"], "數字就是音": ["Numbers are notes", "数字が音"], "1 2 3 4 5 6 7 就是 Do Re Mi Fa Sol La Si，不用學五線譜也能拉。": ["1 2 3 4 5 6 7 are Do Re Mi Fa Sol La Si. You can play without learning staff notation.", "1 2 3 4 5 6 7 はド レ ミ ファ ソ ラ シ。五線譜を知らなくても弾けます。"], "橫線讓音變長": ["A dash makes a note longer", "横線は音をのばす"], "「1 –」拉兩拍，「1 – – –」拉四拍。": ["\"1 –\" lasts two beats; \"1 – – –\" lasts four.", "「1 –」は2拍、「1 – – –」は4拍です。"], "先聽示範，再拉「1 2 3 – 3 2 1 –」": ["Listen to the demo, then play \"1 2 3 – 3 2 1 –\"", "模範を聴いてから「1 2 3 – 3 2 1 –」を弾く"], "按「示範演奏」聽一次，再按「開始演奏」跟著拉。": ["Press Demo to listen once, then press Play and follow along.", "「模範演奏」で一度聴き、「演奏する」を押して合わせて弾きましょう。"], "四個手指": ["Four fingers", "4本の指"], "用四個手指拉出 D 調音階": ["Play the D scale with four fingers", "4本の指でD調の音階を弾く"], "內弦的手指": ["Fingers on the inner string", "内弦の指"], "空弦 1、食指 2、中指 3、無名指 4。": ["Open 1, index 2, middle 3, ring 4.", "開放弦1、人差し指2、中指3、薬指4。"], "外弦的手指": ["Fingers on the outer string", "外弦の指"], "空弦 5、食指 6、中指 7、無名指 1（高音 Do）。": ["Open 5, index 6, middle 7, ring high 1 (high Do).", "開放弦5、人差し指6、中指7、薬指は高い1（高いド）。"], "手指自然彎曲": ["Curve your fingers naturally", "指は自然に曲げる"], "用指尖按弦，手像握著一顆小球。": ["Press with the fingertips, hand shaped as if holding a small ball.", "指先で弦を押さえ、小さなボールを握るような手の形に。"], "左手手形保持放鬆 5 秒": ["Keep your left hand relaxed for 5 seconds", "左手をリラックスして5秒キープ"], "按著弦時看看左手骨架是不是綠色。": ["While pressing a string, check that the left-hand skeleton is green.", "弦を押さえながら、左手の線が緑か確認しましょう。"], "拉一次 D 調音階（上行再下行）": ["Play the D scale once (up, then down)", "D調の音階を1回（上がって下がる）"], "每個音都慢慢拉、聽準了再換。": ["Play each note slowly and move on only when it is in tune.", "1音ずつゆっくり、音程を確かめてから次へ。"], "第一段旋律": ["Your first melody", "はじめてのメロディー"], "拉出小蜜蜂的第一段": ["Play the opening of Little Bee", "小さなミツバチの最初の部分を弾く"], "先聽再拉": ["Listen, then play", "聴いてから弾く"], "每一首新的旋律，都先按「示範演奏」聽一次。": ["For every new melody, press Demo and listen once first.", "新しいメロディーは、まず「模範演奏」で一度聴きましょう。"], "跟著亮起來的音": ["Follow the lit note", "光る音を追う"], "演奏時，現在該拉的音會亮起來，跟著它走就好。": ["While you play, the current note lights up. Just follow it.", "演奏中は今弾く音が光ります。それを追いかけましょう。"], "拉出小蜜蜂的前四小節": ["Play the first four bars of Little Bee", "小さなミツバチの最初の4小節を弾く"], "音準和節奏都達到 55% 就過關。": ["Pass with 55% on both pitch and rhythm.", "音程とリズムがどちらも55%で合格です。"], "完整拉完一首小蜜蜂": ["Play Little Bee all the way through", "小さなミツバチを通して弾く"], "樂句就像一句話": ["A phrase is like a sentence", "フレーズは文のようなもの"], "每兩小節是一句，一句結束時可以輕輕換氣。": ["Every two bars make a phrase; breathe gently at the end of each.", "2小節でひとまとまり。フレーズの終わりで軽く息をつきます。"], "完整拉完小蜜蜂": ["Play all of Little Bee", "小さなミツバチを最後まで弾く"], "這是你的第一首完整的歌！": ["This is your first complete song!", "はじめての完全な1曲です！"], "拉完小星星": ["Play all of Twinkle Twinkle", "きらきら星を最後まで弾く"], "6 要用外弦食指": ["6 is the index finger on the outer string", "6は外弦の人差し指"], "外弦空弦是 5，食指按下去就是 6。": ["Open outer string is 5; press the index finger and you get 6.", "外弦の開放弦が5、人差し指で押さえると6です。"], "音準和節奏都達到 65% 就過關。": ["Pass with 65% on both pitch and rhythm.", "音程とリズムがどちらも65%で合格です。"], "拉完瑪莉有隻小綿羊": ["Play all of Mary Had a Little Lamb", "メリーさんのひつじを最後まで弾く"], "注意第二行有連續四個 3。": ["Watch for four 3s in a row on the second line.", "2行目に3が4つ続くところに注意。"], "強弱變化": ["Dynamics", "強弱の変化"], "拉出強弱變化": ["Play loud and soft", "強弱をつけて弾く"], "p 是弱、f 是強": ["p is soft, f is loud", "pは弱く、fは強く"], "譜上的 p、mp、mf、f，從最小聲到最大聲。": ["p, mp, mf, f on the score run from softest to loudest.", "楽譜のp・mp・mf・fは、小さい音から大きい音の順です。"], "靠弓壓和弓速": ["Use bow weight and speed", "弓の圧力と速さで"], "大聲時弓多一點重量、速度快一點；小聲時反過來。": ["For loud, add weight and speed; for soft, the opposite.", "大きい音は圧力と速さを増やし、小さい音はその逆です。"], "4 拍一弓：一弓小聲、一弓大聲（16 拍）": ["One bow per 4 beats: one soft, one loud (16 beats)", "4拍1弓：小さく1弓、大きく1弓（16拍）"], "用內弦或外弦都可以。": ["Either string is fine.", "内弦でも外弦でもかまいません。"], "換弦與換弓": ["String crossing and bow changes", "移弦と弓の返し"], "流暢地換弦與換弓": ["Cross strings and change bow smoothly", "なめらかに移弦し、弓を返す"], "換弦用手腕": ["Cross strings with the wrist", "移弦は手首で"], "手腕輕輕轉，弓毛就從內弦到外弦。": ["A gentle turn of the wrist moves the hair from inner to outer string.", "手首を軽く回すと、弓毛が内弦から外弦へ移ります。"], "換弓不斷音": ["Change bow without a gap", "音を切らずに弓を返す"], "換方向前稍微放慢，聲音就會連在一起。": ["Slow slightly before changing direction and the notes connect.", "返す直前に少しゆっくりすると、音がつながります。"], "內外弦交替，每 2 拍換一次（16 拍）": ["Alternate inner and outer strings every 2 beats (16 beats)", "内弦と外弦を2拍ごとに交互に（16拍）"], "拉完歡樂頌，學會附點節奏": ["Play Ode to Joy and learn dotted rhythms", "歓喜の歌を弾いて付点リズムを覚える"], "附點讓音變長一半": ["A dot adds half the length", "付点は音を半分のばす"], "「3.」比「3」長一半，後面的「2」就短一點，像「噠－嗒」。": ["\"3.\" is half again as long as \"3\", and the \"2\" after it is shorter, like \"daa-da\".", "「3.」は「3」より半分長く、次の「2」は短くなります。「ターンタ」の感じです。"], "拉完歡樂頌": ["Play all of Ode to Joy", "歓喜の歌を最後まで弾く"], "先聽示範，特別注意附點的長短。": ["Listen to the demo first, noticing the dotted lengths.", "まず模範を聴き、付点の長さに注意しましょう。"], "揉弦入門": ["Intro to vibrato", "ビブラート入門"], "學會揉弦的基本動作": ["Learn the basic vibrato motion", "ビブラートの基本動作を覚える"], "揉弦讓聲音有感情": ["Vibrato gives the sound feeling", "ビブラートで音に表情を"], "按弦的手指上下輕輕滾動，讓音高微微起伏。": ["Roll the pressing finger gently up and down so the pitch wavers slightly.", "押さえている指を上下に軽く転がし、音程をわずかに揺らします。"], "先慢後快": ["Slow first, then faster", "ゆっくりから速く"], "先一拍揉兩下，熟了再慢慢加快。": ["Start with two waves per beat and speed up as it gets easy.", "まず1拍に2回、慣れたら少しずつ速くします。"], "跟著節拍，一拍揉兩下（16 拍）": ["With the beat, two waves per beat (16 beats)", "拍に合わせて1拍に2回（16拍）"], "用中指按住 3，手腕放鬆跟著節拍揉。": ["Hold 3 with the middle finger and rock a relaxed wrist with the beat.", "中指で3を押さえ、手首の力を抜いて拍に合わせて揺らします。"], "手腕和肩膀有沒有放鬆？": ["Were your wrist and shoulders relaxed?", "手首と肩はリラックスしていましたか？"], "揉弦時肩膀也要放鬆喔。": ["Keep the shoulders relaxed during vibrato too.", "ビブラートのときも肩の力を抜きましょう。"], "拉完送別，用上揉弦": ["Play Farewell with vibrato", "送別をビブラートをつけて弾く"], "拉完送別": ["Play all of Farewell", "送別を最後まで弾く"], "長音的地方試試加上揉弦。": ["Try adding vibrato on the long notes.", "長い音にビブラートをつけてみましょう。"], "拉完茉莉花": ["Play all of Jasmine Flower", "茉莉花を最後まで弾く"], "這首會用到高音 1，慢慢來。": ["This one uses high 1. Take your time.", "この曲には高い1が出てきます。ゆっくりどうぞ。"], "我的第一場演奏": ["My first performance", "はじめての発表"], "完成第一段完整的演奏": ["Complete your first full performance", "はじめての通し演奏をやり遂げる"], "像上台一樣": ["As if on stage", "本番のつもりで"], "選一首最喜歡的歌，從頭拉到尾，錯了也不停。": ["Pick your favorite song and play it start to finish without stopping for mistakes.", "いちばん好きな曲を選び、間違えても止まらず最後まで弾きます。"], "錄下來聽": ["Record and listen", "録音して聴く"], "App 內的錄音功能還在開發中，先用手機的錄音機錄一次。": ["In-app recording is still in development; use your phone's recorder for now.", "アプリ内の録音機能は開発中です。スマホの録音アプリで録ってみましょう。"], "「我要表演」：不看引導拉完小星星": ["Perform: play Twinkle Twinkle without guides", "本番：ガイドなしできらきら星を弾く"], "這次試著不靠位置引導。": ["Try it without the position guide this time.", "今回は位置ガイドに頼らずに弾いてみましょう。"], "錄下來，聽聽自己的演奏": ["Record yourself and listen back", "録音して自分の演奏を聴く"], "你已經從零開始走到這裡了！": ["You have come all this way from zero!", "ゼロからここまで来ました！"], "基本功": ["Fundamentals", "基礎"], "長弓練習": ["Long-bow practice", "長弓の練習"], "長弓": ["Long bows", "長弓"], "弓與琴桿 90 度": ["Bow at 90° to the neck", "弓と棹を90度に"], "全弓運行時弓桿保持水平，和琴桿垂直。": ["Keep the stick level through the whole bow, perpendicular to the neck.", "弓全体を通して弓竿を水平に、棹と垂直に保ちます。"], "勻速、勻力": ["Even speed, even weight", "速さと力を一定に"], "開頭、中段、弓尖的音量一致，換弓不斷音。": ["Same volume at frog, middle and tip; no gap at bow changes.", "元・中・先で音量をそろえ、返しで音を切らないように。"], "由大臂帶動，肩膀不聳起。": ["Drive from the upper arm; don't raise the shoulder.", "上腕から動かし、肩は上げません。"], "40 BPM，4 拍一弓（16 拍）": ["40 BPM, 4 beats per bow (16 beats)", "40 BPM、4拍1弓（16拍）"], "推、拉各 4 拍，專注在換弓的銜接。": ["Push and pull 4 beats each, focusing on smooth bow changes.", "押し・引き各4拍、弓の返しのつながりに集中します。"], "弓 90 度、肩膀放鬆，維持 8 秒": ["Bow at 90°, shoulders relaxed, hold 8 seconds", "弓90度・肩リラックスで8秒キープ"], "邊拉長弓邊看畫面，兩條線都保持綠色。": ["Watch the screen while bowing; keep both lines green.", "長弓を弾きながら画面を見て、2本の線を緑に保ちます。"], "過弦練習": ["String-crossing practice", "移弦の練習"], "過弦": ["String crossing", "移弦"], "手腕帶動換弦": ["Cross with the wrist", "手首で移弦"], "換弦靠手腕與前臂的小角度，弓毛始終貼弦。": ["Cross with a small wrist and forearm angle, hair always on the string.", "手首と前腕の小さな角度で移弦し、弓毛は常に弦に触れたまま。"], "先分弓、再連弓": ["Separate bows first, then slurred", "分弓から、次にスラー"], "慢速分弓換弦穩定後，再練連弓過弦。": ["Once slow separate-bow crossings are steady, practice slurred crossings.", "ゆっくりの分弓で安定したら、スラーの移弦へ。"], "60 BPM 內外弦交替（32 拍）": ["60 BPM, alternate inner and outer (32 beats)", "60 BPM で内弦と外弦を交互に（32拍）"], "一拍換一次弦，音色保持一致。": ["Change string every beat with a consistent tone.", "1拍ごとに移弦し、音色をそろえます。"], "音準練習": ["Intonation practice", "音程の練習"], "音準": ["Intonation", "音程"], "先對空弦": ["Check the open strings first", "まず開放弦を合わせる"], "每次練習先用調音器確認內外弦。": ["Start every session by checking both strings with the tuner.", "毎回チューナーで内弦と外弦を確認してから始めます。"], "一個音一個音確認": ["One note at a time", "1音ずつ確認"], "慢速音階，每個音停住聽準再走。": ["Slow scales: stop on each note and tune it before moving on.", "ゆっくりの音階で、1音ずつ止まって音程を合わせてから進みます。"], "內弦 D 穩定 3 秒": ["Hold inner D steady for 3 seconds", "内弦Dを3秒安定"], "弓速放慢，讓指針穩在綠色區。": ["Slow the bow and keep the needle in the green.", "弓をゆっくりにして、針を緑のゾーンに。"], "外弦 A 穩定 3 秒": ["Hold outer A steady for 3 seconds", "外弦Aを3秒安定"], "視奏一份 AI 譜，音準與節奏達 75%": ["Sight-read an AI score with 75% pitch and rhythm", "AIの譜面を初見で弾き、音程とリズム75%"], "可以先按「示範演奏」聽一次。": ["You can press Demo to listen first.", "先に「模範演奏」で聴いてもかまいません。"], "指序練習": ["Finger-pattern practice", "指順の練習"], "指序": ["Finger patterns", "指順"], "手指像握著東西般彎曲、靠攏，指尖按弦。": ["Curve and close your fingers as if holding something; press with the fingertips.", "何かを握るように指を曲げてそろえ、指先で押さえます。"], "保留手指": ["Keep fingers down", "指を残す"], "上行時下方手指保持按住，減少多餘動作。": ["Going up, keep the lower fingers pressed to reduce extra motion.", "上行では下の指を押さえたままにして、無駄な動きを減らします。"], "左手手形保持放鬆 8 秒": ["Keep your left hand relaxed for 8 seconds", "左手をリラックスして8秒キープ"], "邊練指序邊看左手骨架，保持綠色。": ["Watch the left-hand skeleton while practicing and keep it green.", "指順を練習しながら左手の線を見て、緑に保ちます。"], "換把練習": ["Shifting practice", "ポジション移動の練習"], "換把": ["Shifting", "ポジション移動"], "先聽再換": ["Hear it, then shift", "聴いてから移る"], "換把前先在心裡唱出目標音。": ["Sing the target note in your head before you shift.", "移動の前に、心の中で目標の音を歌います。"], "大臂帶小臂": ["Upper arm leads the forearm", "上腕が前腕をリード"], "用整隻手臂移動，肩膀不聳。": ["Move the whole arm; don't raise the shoulder.", "腕全体で動かし、肩は上げません。"], "換把時肩膀與手肘保持正確 6 秒": ["Keep shoulder and elbow correct while shifting for 6 seconds", "移動中、肩とひじを正しく6秒キープ"], "手肘不要抬太高。": ["Don't lift the elbow too high.", "ひじを上げすぎないように。"], "音階與技巧": ["Scales and technique", "音階と技巧"], "各調音階與琶音": ["Scales and arpeggios in all keys", "各調の音階とアルペジオ"], "音階與琶音": ["Scales and arpeggios", "音階とアルペジオ"], "每天輪替 2～3 個調": ["Rotate 2–3 keys a day", "毎日2〜3調をローテーション"], "五聲、七聲音階與琶音依序練，一週走完所有調。": ["Practice pentatonic and seven-note scales and arpeggios in turn, covering every key each week.", "五音・七音音階とアルペジオを順に練習し、1週間で全調を回ります。"], "慢速到原速": ["From slow to full tempo", "ゆっくりから原速へ"], "先 60%，連續三次無誤再提速。": ["Start at 60%; speed up after three clean runs in a row.", "60%から始め、3回続けてミスなしならテンポを上げます。"], "72 BPM 跟拍練一輪（32 拍）": ["72 BPM, one round with the beat (32 beats)", "72 BPM で拍に合わせて1周（32拍）"], "模進音型": ["Sequence patterns", "反復進行の音型"], "模進": ["Sequences", "反復進行"], "找出模式": ["Find the pattern", "パターンを見つける"], "先看懂音型怎麼重複，再一組一組往上移。": ["See how the figure repeats, then move it up one group at a time.", "音型の繰り返し方を理解してから、1グループずつ上へ移します。"], "視奏專業級 AI 譜，達 70%": ["Sight-read a pro-level AI score at 70%", "プロ級AI譜面を初見で70%"], "樂曲": ["Repertoire", "曲"], "練習曲困難片段": ["Hard passages in an étude", "練習曲の難所"], "困難片段": ["Hard passages", "難所"], "只挑 2 小節": ["Pick just 2 bars", "2小節だけ選ぶ"], "找出最難的 2 小節，其他先放著。": ["Find the hardest 2 bars and leave the rest for now.", "いちばん難しい2小節を選び、ほかは後回しにします。"], "慢練 60% 速度": ["Slow practice at 60%", "60%でゆっくり練習"], "連續三次無誤再加 5 BPM。": ["Add 5 BPM after three clean runs in a row.", "3回続けてミスなしなら5 BPM上げます。"], "50 BPM 慢練（32 拍）": ["Slow practice at 50 BPM (32 beats)", "50 BPMでゆっくり練習（32拍）"], "練習曲全曲": ["Full étude", "練習曲を通して"], "不中斷演奏": ["Play without stopping", "止まらずに弾く"], "錯了也不停，練習完整的演奏感。": ["Keep going through mistakes to build a sense of the whole performance.", "間違えても止まらず、通して演奏する感覚を養います。"], "考試或目標曲": ["Exam or target piece", "試験曲・目標曲"], "目標曲": ["Target piece", "目標曲"], "錄音回聽": ["Record and listen", "録音して聴き返す"], "每天至少錄一次，聽出自己沒注意到的地方。": ["Record at least once a day to catch what you didn't notice.", "毎日少なくとも1回録音し、気づかなかった点を見つけます。"], "模擬上台": ["Mock performance", "本番シミュレーション"], "從頭到尾不停，像在考試一樣。": ["Play start to finish without stopping, as if in an exam.", "試験のつもりで、最初から最後まで止まらずに。"], "第一階段・安裝二胡": ["Stage 1 · Setting up the erhu", "ステージ1・二胡の準備"], "第二階段・認識二胡": ["Stage 2 · Meet the erhu", "ステージ2・二胡を知る"], "第三階段・基本運弓": ["Stage 3 · Basic bowing", "ステージ3・基本の運弓"], "第四階段・左手指法": ["Stage 4 · Left-hand fingering", "ステージ4・左手の運指"], "第五階段・第一首歌": ["Stage 5 · Your first song", "ステージ5・はじめての曲"], "第六階段・音樂表情": ["Stage 6 · Musical expression", "ステージ6・音楽表現"], "第七階段・個人演奏": ["Stage 7 · Solo performance", "ステージ7・ソロ演奏"], "開始前": ["Before you start", "始める前に"], "如何安裝弦": ["Installing the strings", "弦の張り方"], "把內弦和外弦裝到正確的位置": ["Put the inner and outer strings in the right place", "内弦と外弦を正しく張る"], "分清楚內弦和外弦": ["Tell the inner and outer strings apart", "内弦と外弦を見分ける"], "內弦比較粗、聲音比較低；外弦比較細、聲音比較高。內弦接上方的琴軸，外弦接下方的琴軸。": ["The inner string is thicker and lower; the outer string is thinner and higher. The inner string goes to the upper peg, the outer string to the lower peg.", "内弦は太く低い音、外弦は細く高い音。内弦は上の糸巻き、外弦は下の糸巻きにつなぎます。"], "弦尾掛在琴筒下方": ["Hook the string end below the drum", "弦の端を胴の下に掛ける"], "弦的一端有小圈，掛在琴筒下方、琴桿底部的掛弦處，另一端往上拉到琴軸。": ["One end of the string has a small loop. Hook it at the bottom of the neck below the drum, then bring the other end up to the peg.", "弦の片端の輪を胴の下、棹の底の弦掛けに掛け、もう片端を糸巻きまで上げます。"], "穿過琴軸的小孔再纏繞": ["Thread it through the peg and wind it", "糸巻きの穴に通して巻く"], "弦穿過琴軸上的小孔，一邊轉琴軸一邊把琴軸往裡推，讓它咬緊不會鬆脫，弦要整齊地纏在琴軸上。": ["Thread the string through the hole in the peg. Turn the peg while pushing it inward so it grips and does not slip, and wind the string neatly.", "弦を糸巻きの穴に通し、糸巻きを回しながら奥へ押し込んで固定し、きれいに巻きます。"], "經過千斤和琴碼，再慢慢調緊": ["Run it through the qianjin and over the bridge, then tighten slowly", "千斤と駒を通してからゆっくり締める"], "弦要從千斤裡面通過，再架到琴碼上。不要一次轉太緊，之後調音時再慢慢轉到正確的音。": ["The string passes through the qianjin and rests on the bridge. Do not tighten it all at once; bring it up to pitch slowly when tuning.", "弦は千斤の中を通して駒に乗せます。一気に締めず、調弦のときにゆっくり正しい音にします。"], "照著步驟把兩條弦裝好": ["Install both strings step by step", "手順どおりに2本の弦を張る"], "裝好後用手指輕輕撥一下，內弦比外弦低，就代表裝對了。": ["When done, pluck them gently: if the inner string is lower than the outer one, they are on correctly.", "張れたら指で軽くはじき、内弦が外弦より低ければ正しく張れています。"], "千斤": ["The qianjin", "千斤"], "知道千斤的作用和正確的綁法": ["Learn what the qianjin does and how it is tied", "千斤の役割と結び方を知る"], "千斤是什麼": ["What the qianjin is", "千斤とは"], "千斤是綁在琴桿上的線，把兩條弦拉向琴桿。千斤到琴碼之間，就是弦能振動的長度。": ["The qianjin is a cord tied round the neck that pulls both strings toward it. The part between the qianjin and the bridge is the vibrating length of the strings.", "千斤は棹に結ぶ糸で、2本の弦を棹側へ引き寄せます。千斤から駒までが弦の振動する長さです。"], "弦和琴桿的距離": ["Distance between strings and neck", "弦と棹の距離"], "千斤處的弦和琴桿大約相距 1.5 到 2 公分。太遠按弦會很吃力，太近手指容易碰到琴桿。": ["At the qianjin the strings sit about 1.5 to 2 cm from the neck. Too far makes pressing hard; too close and your fingers hit the neck.", "千斤のところで弦と棹の間は約1.5〜2cm。離れすぎると押さえにくく、近すぎると指が棹に当たります。"], "綁法：先繞琴桿，再勾住琴弦": ["How to tie it: round the neck, then hook the strings", "結び方：棹に巻いてから弦を引っ掛ける"], "千斤線先在琴桿上繞好，再往前勾住內外兩條弦拉向琴桿，重複幾次並排整齊，最後打結固定。": ["Wind the cord round the neck, hook it over both strings and pull them toward the neck. Repeat a few times side by side, then tie it off.", "千斤の糸を棹に巻き、内外2本の弦に掛けて棹側へ引き、何度か並べて繰り返し、最後に結んで留めます。"], "千斤的高低會改變音高": ["Moving the qianjin changes the pitch", "千斤の高さで音が変わる"], "千斤往下移，弦變短，音會變高；往上移，弦變長，音會變低。位置確定後就不要常常移動。": ["Move it down and the string gets shorter and higher; move it up and it gets longer and lower. Once set, leave it in place.", "千斤を下げると弦が短くなり音が高く、上げると長くなり低くなります。決まったらあまり動かしません。"], "檢查你的千斤": ["Check your qianjin", "千斤を確認する"], "看看千斤有沒有綁緊，兩條弦有沒有一起被拉向琴桿。": ["Make sure it is tight and that both strings are pulled toward the neck together.", "千斤がしっかり結ばれ、2本の弦が一緒に棹側へ引かれているか確認します。"], "琴碼": ["The bridge", "駒"], "把琴碼放在正確的位置": ["Place the bridge correctly", "駒を正しい位置に置く"], "琴碼的作用": ["What the bridge does", "駒の役割"], "琴碼架設於琴弦與琴皮之間，負責傳導琴弦振動，影響二胡音色與共鳴。": ["The bridge sits between the strings and the skin. It carries the strings' vibration and shapes the erhu's tone and resonance.", "駒は弦と皮の間に立ち、弦の振動を伝えて、二胡の音色と響きを左右します。"], "放在琴皮中間附近": ["Near the middle of the skin", "皮の中央付近に置く"], "琴碼通常放在琴皮中間附近，可以上下微調，找出聲音最好聽的位置。": ["The bridge usually sits near the middle of the skin; nudge it up or down to find where it sounds best.", "駒はふつう皮の中央付近に置き、上下に少し動かして一番よく鳴る位置を探します。"], "站正、底部貼平": ["Upright and flat", "まっすぐ、底を密着"], "琴碼要站直不要歪，底部整個貼在琴皮上，兩條弦分別卡在琴碼上方的凹槽裡。": ["Keep it upright, its base flat on the skin, with each string in its groove on top.", "駒はまっすぐ立て、底を皮にぴったり付け、2本の弦を上の溝にそれぞれ乗せます。"], "調完音再檢查一次": ["Check again after tuning", "調弦後にもう一度確認"], "把弦轉緊時琴碼可能被拉歪，調完音要再看一次琴碼有沒有站正。": ["Tightening the strings can pull the bridge over, so look again after tuning.", "弦を締めると駒が傾くことがあるので、調弦後にもう一度確認します。"], "檢查你的琴碼": ["Check your bridge", "駒を確認する"], "確認琴碼站正、底部貼平，兩條弦都卡在凹槽裡。": ["Make sure it is upright, flat on the skin and both strings sit in the grooves.", "駒がまっすぐで底が密着し、2本の弦が溝に乗っているか確認します。"], "墊布": ["The felt pad", "フェルト"], "知道墊布的作用和放法": ["Learn what the felt pad does and where it goes", "フェルトの役割と置き方を知る"], "墊布的作用": ["What the felt pad does", "フェルトの役割"], "墊布放置於琴碼下方，用來保護琴皮、調整音色，減少雜音與共振。": ["The felt pad sits below the bridge. It protects the skin, adjusts the tone and cuts down buzzing and unwanted resonance.", "駒の下に置く布で、皮を守り、音色を整え、雑音や余計な共鳴を抑えます。"], "放在琴碼下方": ["Put it below the bridge", "駒の下に置く"], "把墊布折好，塞在琴碼下方、琴弦和琴皮之間，輕輕碰到琴皮就好。": ["Fold it and tuck it below the bridge, between the strings and the skin, just touching the skin.", "フェルトを折って駒の下、弦と皮の間に差し込み、皮に軽く触れる程度にします。"], "鬆緊會改變聲音": ["How tight it is changes the sound", "きつさで音が変わる"], "墊布塞太緊，聲音會變悶；太鬆或沒有墊布，容易出現沙沙的雜音。": ["Too tight and the sound gets muffled; too loose or missing and you get a buzzing noise.", "きつすぎると音がこもり、ゆるすぎたり無かったりするとジージーと雑音が出ます。"], "放好你的墊布": ["Put your felt pad in place", "フェルトを置く"], "放好後用手指撥一下空弦，聽聽聲音是不是乾淨、沒有雜音。": ["Then pluck an open string and listen for a clean sound with no buzz.", "置けたら開放弦を指ではじき、雑音のないきれいな音か聴きます。"], "弓": ["The bow", "弓"], "認識弓的構造，學會保護它": ["Get to know the bow and how to look after it", "弓の構造と扱い方を知る"], "弓的構造": ["Parts of the bow", "弓の構造"], "弓由弓桿和弓毛組成，弓毛是馬尾毛。手握的那一端叫弓根，另一端叫弓尖。": ["The bow has a stick and hair made of horsehair. The end you hold is the frog; the other end is the tip.", "弓は弓竿と馬の毛でできた弓毛からなり、持つ側を元、反対側を先といいます。"], "弓毛夾在兩弦之間": ["The hair stays between the strings", "弓毛は2本の弦の間"], "二胡的弓毛一直夾在內弦和外弦中間，不能拿出來。拉內弦時弓毛貼內弦，拉外弦時貼外弦。": ["On the erhu the bow hair always stays between the inner and outer strings. Press it against the inner string to play it, against the outer string for the other.", "二胡の弓毛は常に内弦と外弦の間にあり、外せません。内弦を弾くときは内弦に、外弦のときは外弦に当てます。"], "不要用手摸弓毛": ["Don't touch the hair", "弓毛に触らない"], "手上的油會讓弓毛打滑、拉不出聲音，拿弓時只碰弓桿和弓根。": ["Oil from your skin makes the hair slip and lose its sound; hold only the stick and frog.", "手の脂で弓毛が滑り音が出なくなるので、弓竿と元だけを持ちます。"], "弓毛的鬆緊": ["Hair tension", "弓毛の張り"], "二胡的弓毛鬆緊是靠右手中指和無名指撐開來控制，弓毛本身不需要調得很緊。": ["On the erhu you control hair tension with your right middle and ring fingers, so the hair itself doesn't need to be very tight.", "二胡の弓毛の張りは右手の中指と薬指で押し広げて調整するので、毛自体を強く張る必要はありません。"], "拿起你的弓看一看": ["Take a look at your bow", "弓を手に取って見る"], "找到弓根、弓尖和弓毛，確認弓毛有夾在兩條弦中間。": ["Find the frog, the tip and the hair, and check that the hair is between the two strings.", "元・先・弓毛を確認し、弓毛が2本の弦の間にあるか確かめます。"], "如何上松香": ["Applying rosin", "松脂の塗り方"], "幫弓毛上好松香": ["Rosin the bow hair properly", "弓毛に松脂を塗る"], "為什麼要上松香": ["Why rosin?", "なぜ松脂を塗るのか"], "松香讓弓毛和琴弦之間產生摩擦，拉的時候才會發出聲音。沒有松香，弓毛會滑過去，拉不出聲音。": ["Rosin gives the hair grip on the strings so they sound when you bow. Without it the hair just slides and you get no sound.", "松脂で弓毛と弦に摩擦が生まれ、音が出ます。松脂がないと弓毛が滑って音が出ません。"], "拿松香在弓毛上來回擦": ["Rub the rosin along the hair", "松脂を弓毛にこすりつける"], "二胡的弓毛夾在弦中間，所以是拿著松香，在弓毛上從弓根到弓尖來回擦，力道要平均。": ["Because the erhu bow hair stays between the strings, you hold the rosin and rub it along the hair from frog to tip, with even pressure.", "二胡の弓毛は弦の間にあるので、松脂を持って元から先まで均等な力で往復させます。"], "新弓要多擦一些": ["A new bow needs more", "新しい弓は多めに"], "新的弓毛要擦比較久，直到弓毛上有一層薄薄的白色粉末；平常練琴前擦幾下就夠了。": ["New hair needs a longer rub, until a thin white dust shows; before normal practice a few strokes are enough.", "新しい弓毛は白い粉が薄く付くまで長めに塗り、普段は練習前に数回で十分です。"], "擦掉多餘的粉": ["Wipe off the extra dust", "余分な粉を拭き取る"], "琴弦、琴皮和琴筒上的松香粉要用軟布擦乾淨，松香太多聲音會變粗。": ["Wipe rosin dust off the strings, skin and drum with a soft cloth; too much rosin makes the sound coarse.", "弦・皮・胴に付いた松脂の粉は柔らかい布で拭き取ります。付けすぎると音が荒れます。"], "幫你的弓上松香": ["Rosin your bow", "弓に松脂を塗る"], "從弓根到弓尖平均地擦，看到弓毛上有薄薄一層白色粉末就好了。": ["Rub evenly from frog to tip until a thin layer of white dust shows on the hair.", "元から先まで均等に塗り、弓毛に白い粉が薄く付けば完了です。"], "先換內弦，再換外弦": ["Change the inner string first, then the outer", "先に内弦、次に外弦を替える"], "換弦時先換內弦，裝好之後再換外弦。一次只拆一條，夾在兩條弦中間的弓毛就不會掉出來。": ["Change the inner string first and the outer one after it. Removing only one at a time keeps the bow hair between the strings.", "弦は先に内弦、張れてから外弦を替えます。一本ずつ外せば、弦の間の弓毛が外れません。"], "虛擬安裝：把內弦和外弦裝上去": ["Virtual install: put on the inner and outer strings", "バーチャル取り付け：内弦と外弦を張る"], "用手機主鏡頭對著桌面，左手拿手機、右手操作。照著引導先裝內弦、再裝外弦，最後轉兩下琴軸，就算挑戰成功。": ["Point the rear camera at the table, hold the phone in your left hand and work with your right. Follow the guide to fit the inner string, then the outer, then turn the pegs twice to complete the challenge.", "背面カメラを机に向け、左手でスマホを持ち右手で操作します。案内に沿って内弦、外弦の順に張り、最後に糸巻きを2回回せばチャレンジ成功です。"], "虛擬安裝：綁上千斤": ["Virtual install: tie the qianjin", "バーチャル取り付け：千斤を結ぶ"], "用手機主鏡頭對著桌面，左手拿手機、右手操作。先把千斤線移到千斤的位置，再繞圈 3 秒，就完成安裝。": ["Point the rear camera at the table, hold the phone in your left hand and use your right. Bring the cord to the qianjin spot, then circle for 3 seconds to finish.", "背面カメラを机に向け、左手でスマホを持ち右手で操作します。糸を千斤の位置へ運び、3秒回せば完成です。"]};
function trCourse(){const i=S.lang==='en'?0:S.lang==='ja'?1:-1,tr=x=>x==null?x:i<0?x:((TRC[x]||[])[i]||x),fx=(o,k)=>{if(o[k]==null)return;if(o['_'+k]==null)o['_'+k]=o[k];o[k]=tr(o['_'+k])};

 const st=streak(),pd=skDelta('pitch'),rd=skDelta('rhythm'),learned=Object.keys(c.done).filter(id=>LX[id]&&LX[id].track==='basic').length;

document.addEventListener('pointerdown',e=>{const hd=e.target.closest('#stuHome .shh');if(!hd)return;e.preventDefault();const row=hd.closest('.shr');SDR={row,id:row.dataset.id};row.classList.add('drag');$('#stuHome').dataset.drag='1';try{hd.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!SDR)return;e.preventDefault();const el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return;const tr=el.closest('#sch .shr'),gp=el.closest('#sch .scg');
 if(tr&&tr!==SDR.row){const r=tr.getBoundingClientRect();tr.parentNode.insertBefore(SDR.row,e.clientY<r.top+r.height/2?tr:tr.nextSibling)}
 else if(!tr&&gp&&!gp.contains(SDR.row)){const em=gp.querySelector('.shempty');if(em)em.remove();gp.appendChild(SDR.row)}},{passive:false});
document.addEventListener('pointerup',()=>{if(!SDR)return;const order=[];$$('#sch .scg').forEach(g=>g.querySelectorAll('.shr').forEach(r=>{const k=tkFind(r.dataset.id);if(k){k.cat=g.dataset.cat;order.push(k)}}));
 if(order.length===S.task.list.length){S.task.list=order;tkTouch();save()}SDR.row.classList.remove('drag');SDR=null;$('#stuHome').dataset.drag='';stuHomeUI()});
setInterval(()=>{if(S.role==='student'&&$('#v-today').classList.contains('on')&&!SDR&&$('#exForm')&&$('#exForm').hidden)stuHomeUI()},3000);
/* ---- 首頁跟著進度長大 ---- */
const PREP=['prep1','prep2','prep3','prep4','prep5'];
function lastGain(){const c=S.course||{},ids=Object.keys(c.done||{}).filter(id=>LX[id]&&LX[id].track==='basic');return ids.length?LX[ids[ids.length-1]].gain:''}
function stageDone(i){const u=TRACKS.basic[i];return !!u&&u.ls.every(l=>S.course.done[l.id])}
function homeExtras(learned,pd,rd){$$('.simcimg').forEach(i=>{if(!i.src)i.src=IMG.erhu});const stu=S.role==='student',hasData=weekDays()>0||learned>0||pd||rd;
 $('#listenCard').hidden=stu||learned>=3;
 S.prep=S.prep||{};const prepAll=PREP.every(k=>S.prep[k]),pc=$('#prepCard');pc.hidden=stu||learned>=3;
 pc.innerHTML=prepAll?`<button class="prepok" id="prepOpen">✓ ${t('prepDone')}<span class="mut">${t('prepEdit')}</span></button>`:
  `<div class="tlh"><b>🧰 ${t('prepT')}</b><span class="mut">${PREP.filter(k=>S.prep[k]).length} / ${PREP.length}</span></div><p class="mut" style="margin:.2rem 0 .5rem;font-size:.8125rem">${t('prepSub')}</p>`+
  PREP.map(k=>`<label class="prepi${S.prep[k]?' d':''}"><input type="checkbox" data-prep="${k}" ${S.prep[k]?'checked':''}><span><b>${t(k)}</b><em>${t(k+'D')}</em></span></label>`).join('');
 if(prepAll&&window._prepOpen){pc.innerHTML=PREP.map(k=>`<label class="prepi d"><input type="checkbox" data-prep="${k}" checked><span><b>${t(k)}</b><em>${t(k+'D')}</em></span></label>`).join('')}
 $('#journeyBox').hidden=stu;
 if(!stu){const n=nextLesson(),cur=n&&n.track==='basic'?n.ui:TRACKS.basic.length;
  $('#journey').innerHTML=TRACKS.basic.map((u,i)=>{const d=stageDone(i),now=i===cur,nm=(u.u.split(/[・·]/)[1]||u.u).trim();
   return `<div class="jn${d?' d':''}${now?' now':''}"><span class="jd">${d?'✓':i+1}</span><b>${esc(nm)}</b>${now?`<em>${t('youHere')}</em>`:''}</div>`}).join('')}
 $('#growBox').hidden=!stu&&!hasData;
 const warmOn=stu||stageDone(1);$('#warmBox').hidden=!warmOn;
 const sb=document.querySelector('.warm [data-go=songs]');if(sb)sb.style.display=!stu&&S.course.done.b9?'':'none';
 $('#fixBox').hidden=stu;
 if(!stu)$('#fixes').innerHTML=`<p class="lbl">${t('fixT')}</p>`+[1,2,3,4,5].map(i=>{const [q,a]=t('fix'+i).split('§');return `<details class="fix"><summary>${esc(q)}</summary><p>${esc(a||'')}</p></details>`}).join('')}
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.prep;if(!k)return;S.prep=S.prep||{};S.prep[k]=e.target.checked;save();if(PREP.every(x=>S.prep[x])){window._prepOpen=0;toast('✓ '+t('prepDone'))}crUI()});
document.addEventListener('click',e=>{if(e.target.closest('#prepOpen')){window._prepOpen=1;crUI()}});
/* ---- 學習獎勵 ---- */
const lvXP=L=>50*L*(L-1),lvOf=x=>{let L=1;while(lvXP(L+1)<=x)L++;return L};
const BADGES=[['first','🌱','bgFirst',()=>Object.keys(S.course.done).length>=1],
 ...[0,1,2,3,4,5].map(i=>['st'+i,['📖','↔️','✋','🎵','🌊','🏆'][i],'bgSt'+i,()=>{const u=TRACKS.basic[i+1];return u&&u.ls.every(l=>S.course.done[l.id])}]),
 ['song1','🎶','bgSong1',()=>Object.values(S.songBest||{}).some(v=>v>=60)],['song3','📀','bgSong3',()=>Object.values(S.songBest||{}).filter(v=>v>=60).length>=3],
 ['perfect','💯','bgPerfect',()=>Object.values(S.songBest||{}).some(v=>v>=90)],['week3','📅','bgWeek3',()=>weekDays()>=3],['hour','⏳','bgHour',()=>Object.values(S.log||{}).reduce((a,b)=>a+b,0)>=3600]];
function chkBadges(){S.badges=S.badges||{};const nw=BADGES.filter(([id,,,f])=>!S.badges[id]&&(()=>{try{return f()}catch(e){return false}})());nw.forEach(([id])=>S.badges[id]=today());save();
 nw.forEach(([,ic,k],i)=>setTimeout(()=>toast(ic+' '+t('bgGot').replace('{n}',t(k))),1600+i*1800))}
function gainXP(n){if(!n)return;const L0=lvOf(S.xp||0);S.xp=(S.xp||0)+n;save();const L1=lvOf(S.xp);if(S.role==='student'){chkBadges();return}
 xpPop('+'+n+' EXP');if(L1>L0)setTimeout(()=>{xpPop('Lv.'+L1+' · '+lvName(L1));tkChime()},1300);chkBadges()}
const lvName=L=>t('lvN'+Math.min(L,6));
function xpPop(x){const e=document.createElement('div');e.className='xppop';e.textContent=x;document.body.appendChild(e);setTimeout(()=>e.remove(),1900)}
const lessonXP=l=>10*l.steps.length+10;
function stepLabel(st){if(st.t==='learn')return st.cards.length>1?t('stLearnN').replace('{h}',st.cards[0].h).replace('{n}',st.cards.length):st.cards[0].h;
 if(st.t==='rate')return t('rateT');if(st.t==='timer'){const tk=tkTaskFor(st.k);return t('timerGoal').replace('{n}',tk?tkNm(tk):t(st.k)).replace('{m}',tk?tk.min:20)}return st.h}
function songXP(k,sc){S.songBest=S.songBest||{};const old=S.songBest[k]||0;if(sc<=old)return 0;S.songBest[k]=sc;save();let x=0;if(old<60&&sc>=60)x+=30;if(old<90&&sc>=90)x+=20;return x}
function lvCard(){const x=S.xp||0,L=lvOf(x),a=lvXP(L),b=lvXP(L+1);
 return `<div class="lvc"><div class="lvb">Lv.${L}</div><div class="lvi"><b>${lvName(L)}</b><div class="bar"><i style="width:${Math.round((x-a)/(b-a)*100)}%"></i></div><span class="mut">${x} EXP · ${t('lvNext').replace('{n}',b-x)}</span></div></div>`}
/* ---- 曲庫 ---- */
const SCAT=[['kid','catKid'],['foreign','catForeign'],['folk','catFolk'],['classic','catClassic']];
function songsUI(){const c=crInit();$('#songCards').innerHTML=SCAT.map(([c,k])=>{const ss=Object.entries(SONGS).filter(([,v])=>v.cat===c);if(!ss.length)return'';
 return `<p class="lbl" style="margin-top:.9rem">${t(k)}</p>`+ss.map(([key,v])=>`<div class="sgc"><div class="sgh"><b>${esc(v.n)}</b><span class="lvd">${'●'.repeat(v.lv)}${'○'.repeat(3-v.lv)}</span></div><p class="mut">${esc(v.intro||'')}</p><div class="sgf"><span class="mut">${songBest(key)?t('plBest').replace('{n}',songBest(key)):''}</span><button class="btn" data-sg="${key}" data-auto="1"><svg class="ic"><use href="#i-play"/></svg><span>${t('playGo')}</span></button></div></div>`).join('')}).join('');
$('#wishList').innerHTML=c.wish.map((w,i)=>`<span class="pill">${esc(w)} <button class="x" data-wish="${i}" style="font-size:1rem;padding:0 .1rem">×</button></span>`).join('')}
let PL=null;
function songBest(k){return (S.songBest||{})[k]||0}
function openSong(key,auto){const v=SONGS[key];if(!v)return;if(LS&&LS.tool)lbHide();PL={key,slow:PL&&PL.key===key?PL.slow:0,lesson:0};const o=O();if(o.gClick==null)o.gClick=1;save();
 songLoad(key,plTempo());view('play');if(auto)setTimeout(()=>{if($('#v-play').classList.contains('on')&&!(P&&P.on))startDrill()},450)}
const plTempo=()=>{const v=SONGS[PL.key];return PL.slow?Math.round(v.tempo*.75/5)*5:v.tempo};
function plUI(){if(!PL)return;const v=SONGS[PL.key]||{};$('#plTitle').textContent=v.n||'';$('#plIntro').textContent=v.intro||'';$('#plIntro').hidden=!v.intro;
 $('#plBackT').textContent=t(PL.lesson?'backLesson':'nSongs');$('#plOpt').hidden=!!PL.lesson;
 $$('#plSpd button').forEach(b=>b.classList.toggle('sel',+b.dataset.v===PL.slow));$('#plGuide').checked=!!O().gClick;
 const bs=songBest(PL.key);$('#plBest').textContent=bs?t('plBest').replace('{n}',bs):'';$('#plBest').hidden=!bs||!!PL.lesson}
$$('#plSpd button').forEach(b=>b.onclick=()=>{PL.slow=+b.dataset.v;songLoad(PL.key,plTempo());plUI()});
$('#plGuide').onchange=e=>{const o=O();o.gClick=o.gPos=e.target.checked?1:0;save();syncD()};
$('#plBack').onclick=()=>{if(PL&&PL.lesson&&LS)view('lesson');else view('songs')};
const DMV=[];function placeDrill(w){if(!DMV.length)[$('#score').closest('.card'),$('#dDemo'),$('#dGo'),$('#live').closest('.card'),$('#rep')].forEach(n=>DMV.push([n,n.parentNode,n.nextSibling]));
 if(w==='play'){const sl=['#plA','#plB','#plB','#plD','#plE'];DMV.forEach(([n],i)=>$(sl[i]).appendChild(n))}
 else if(DMV[0][0].parentNode!==DMV[0][1])[...DMV].reverse().forEach(([n,p,nx])=>p.insertBefore(n,nx))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-sg]');if(b)openSong(b.dataset.sg,!!b.dataset.auto)});
/* ---- 我的 ---- */
function meUI(){crInit();const p=S.prof||{};$('#meAv').style.backgroundImage=p.av?`url(${p.av})`:'';$('#meAv').textContent=p.av?'':(p.name||'♪').slice(0,1).toUpperCase();
 $('#meName').textContent=p.name||t('meNoName');$('#meRole').textContent=S.role?t('r_'+S.role):'';
 const learned=Object.keys(S.course.done).filter(id=>LX[id]&&LX[id].track==='basic').length;let best=0;Object.values(S.course.sk).forEach(v=>{best=Math.max(best,v.pitch||0)});
 const tot=Object.values(S.log||{}).reduce((a,b)=>a+b,0);
 $('#meStats').innerHTML=`<div class="gi"><b>📅 ${weekDays()}</b><span>${t('gWeek')}</span></div><div class="gi"><b>📚 ${learned}</b><span>${t('gLearned')}</span></div><div class="gi"><b>${fmtHM(tot)}</b><span>${t('gTotal')}</span></div><div class="gi"><b>${best?best+'%':'–'}</b><span>${t('gBest')}</span></div>`;
 $('#meAch').hidden=S.role==='student';$('#meLv').innerHTML=lvCard();const B=S.badges||{};$('#meBadges').innerHTML=BADGES.map(([id,ic,k])=>`<div class="bg${B[id]?' on':''}" title="${t(k+'D')}"><span>${ic}</span><b>${t(k)}</b></div>`).join('');
 $('#stuCard').hidden=S.role!=='student';if(S.role==='student')stuUI()}
$('#meSwitch').onclick=()=>$('#ov').classList.add('on');$('#meTour').onclick=()=>startWalk();
function fill(){[['#bpm',30,500]].forEach(([s,a,b])=>$(s).style.setProperty('--p',((+$(s).value-a)/(b-a)*100)+'%'))}
(function(){const P=(a,r)=>(140+r*Math.sin(a*Math.PI/180)).toFixed(1)+' '+(130-r*Math.cos(a*Math.PI/180)).toFixed(1);
 const arc=(a,b,r)=>`M${P(a,r)}A${r} ${r} 0 0 1 ${P(b,r)}`;let h=`<path d="${arc(-58,58,100)}" fill="none" stroke="var(--bd)" stroke-width="6" stroke-linecap="round"/><path d="${arc(-9.3,9.3,100)}" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="round"/>`;
 for(let c=-50;c<=50;c+=10){const a=c*1.16,L=c%50===0?126:120;h+=`<path d="M${P(a,110)}L${P(a,L)}" stroke="${c===0?'var(--ok)':'var(--mut2)'}" stroke-width="1.5" stroke-linecap="round"/>`}
 h+=`<g id="needle"><path d="M140 130V40" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round"/></g><circle cx="140" cy="130" r="7" fill="var(--sf)" stroke="var(--fg)" stroke-width="2.5"/>`;$('#gauge').innerHTML=h})();
if(!S.mode)S.mode=S.role==='free'?'h':'t';apply();setMode(S.mode);if(!S.role)$('#ov').classList.add('on');else view(startView());
