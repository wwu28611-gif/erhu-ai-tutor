<html lang="zh-TW"><head><meta charset="utf-8">

<title>AI 二胡老師</title>
<style>
:root{--bg:#f4f3f0;--sf:#fff;--sf2:#efeeea;--fg:#1c1c1e;--mut:#6b6b70;--mut2:#a0a0a6;--ln:rgba(28,28,30,.07);--bd:#e2e0db;--ac:#2f5d50;--acf:#fff;--acs:rgba(47,93,80,.09);--ok:#2f7d62;--bad:#b86b2a;--hg:linear-gradient(140deg,#2f5d50,#1d3b33);--hf:#f2faf6;
--sh:0 1px 2px rgba(20,20,20,.04),0 14px 32px -18px rgba(20,20,20,.2);--r:1.25rem;--rm:.875rem;--ease:cubic-bezier(.3,.7,.2,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c0d0e;--sf:#161719;--sf2:#1f2023;--fg:#f5f5f7;--mut:#a1a1a6;--mut2:#6e6e73;--ln:rgba(255,255,255,.08);--bd:#2c2d31;--ac:#7fc4ae;--acf:#0c1512;--acs:rgba(127,196,174,.13);--ok:#7fc4ae;--bad:#e0a063;--hg:linear-gradient(140deg,#21413a,#12211d);--hf:#eaf6f1;--sh:0 0 0 1px rgba(255,255,255,.03) inset,0 14px 32px -18px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c0d0e;--sf:#161719;--sf2:#1f2023;--fg:#f5f5f7;--mut:#a1a1a6;--mut2:#6e6e73;--ln:rgba(255,255,255,.08);--bd:#2c2d31;--ac:#7fc4ae;--acf:#0c1512;--acs:rgba(127,196,174,.13);--ok:#7fc4ae;--bad:#e0a063;--hg:linear-gradient(140deg,#21413a,#12211d);--hf:#eaf6f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans TC","PingFang TC","Hiragino Sans",sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"h""m""n"}
button,select,input{font:inherit;color:inherit}
.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}
/* header */
header{grid-area:h;display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.25rem}
.brand{display:flex;align-items:center;gap:.65rem;font-weight:600;font-size:1rem;letter-spacing:-.01em}
.logo{width:2rem;height:2rem;border-radius:.6rem;background:var(--hg);color:var(--hf);display:grid;place-items:center}
.logo .ic{width:1.1rem;height:1.1rem}
.sb{display:none}
.chip{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--ln);background:var(--sf);border-radius:2rem;padding:.35rem .85rem;font-size:.8125rem;font-weight:500;cursor:pointer;transition:.2s var(--ease)}
.chip::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--ac)}
.chip:hover{background:var(--sf2)}.chip:active{transform:scale(.96)}
/* nav */
nav{grid-area:n;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--sf) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--ln);padding:.35rem .5rem}
nav button{background:none;border:0;border-radius:.75rem;padding:.4rem 0 .3rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.6875rem;font-weight:500;color:var(--mut2);cursor:pointer;transition:color .2s,transform .15s}
nav button:active{transform:scale(.93)}
nav button.on{color:var(--ac)}
/* main */
main{grid-area:m;overflow-y:auto;padding:.5rem 1.25rem 2rem}
.wrap{max-width:62rem;margin:0 auto}
section{display:none}section.on{display:block;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}
.narrow{max-width:38rem;margin:0 auto}
.pt{padding:.5rem 0 1.5rem}
.pt h1{font-size:2rem;line-height:1.1;font-weight:700;letter-spacing:-.035em;margin:0}
.pt p{margin:.5rem 0 0;color:var(--mut);font-size:1rem}
.cols{display:grid;gap:1rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:1.5rem}
.lbl{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);margin:0 0 .9rem}
.mut{color:var(--mut)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;border:0;border-radius:var(--rm);background:var(--ac);color:var(--acf);font-weight:600;padding:.85rem 1.4rem;cursor:pointer;transition:transform .15s var(--ease),filter .2s,box-shadow .2s;box-shadow:0 6px 16px -8px var(--ac)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.lg{width:100%;padding:1rem 1.4rem;font-size:1.0625rem}
.btn.inv{background:var(--hf);color:#1d3b33;box-shadow:none}
.btn.alt{background:var(--sf2);color:var(--fg);box-shadow:none;border:1px solid var(--ln)}.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--bad);box-shadow:none;border:1px solid var(--ln)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* segmented */
.seg{display:flex;background:var(--sf2);border-radius:var(--rm);padding:.2rem;gap:.15rem}
.seg button{flex:1;border:0;background:transparent;border-radius:.65rem;padding:.55rem .5rem;font-weight:500;font-size:.9rem;color:var(--mut);cursor:pointer;transition:.25s var(--ease)}
.seg button.sel{background:var(--sf);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 1px var(--ln)}
/* home */
.hero{background:var(--hg);color:var(--hf);border-radius:var(--r);padding:1.75rem;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-3rem;top:-3rem;width:12rem;height:12rem;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.hero p{margin:.6rem 0 1.4rem;font-size:1.0625rem;line-height:1.55;position:relative;z-index:1;max-width:30rem}
.tiles{display:grid;gap:1rem;grid-template-columns:1fr 1fr}
.tile{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:1.25rem;cursor:pointer;transition:transform .2s var(--ease),border-color .2s;display:flex;flex-direction:column;gap:.9rem}
.tile:hover{border-color:var(--ac)}.tile:active{transform:scale(.98)}
.ico{width:2.75rem;height:2.75rem;border-radius:.85rem;background:var(--acs);color:var(--ac);display:grid;place-items:center}
.tile b{display:block;font-size:1.0625rem;letter-spacing:-.015em}
.tile span.mut{font-size:.8125rem;line-height:1.4;display:block;margin-top:.2rem}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:.9rem;padding:.95rem 1.25rem;min-height:3.5rem;width:100%;background:none;border:0;text-align:left;cursor:default}
.li+.li{border-top:1px solid var(--ln)}
button.li{cursor:pointer;transition:background .15s}button.li:active{background:var(--sf2)}
.li .t{flex:1}.li .v{color:var(--mut);display:flex;align-items:center;gap:.3rem}
.li .ic{color:var(--mut2)}
.pill{display:inline-block;font-size:.6875rem;font-weight:600;padding:.15rem .6rem;border-radius:2rem;background:var(--sf2);color:var(--mut)}
.gap{height:1.5rem}
/* gauge */
.gauge{width:100%;max-width:25rem;margin:0 auto;display:block;overflow:visible}
#needle{transition:transform .14s var(--ease),opacity .3s;transform-origin:140px 130px;opacity:.3}
.note{font-size:4.5rem;font-weight:600;line-height:1;text-align:center;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:.5rem}
.sub{text-align:center;color:var(--mut);font-size:.9375rem;margin-top:.4rem;font-variant-numeric:tabular-nums;min-height:1.5rem}
#status{text-align:center;font-weight:600;font-size:.9375rem;margin:1rem auto 0;padding:.4rem 1rem;border-radius:2rem;width:fit-content;background:color-mix(in srgb,currentColor 10%,transparent);transition:color .2s}
#status:empty{visibility:hidden}
#cents{font-variant-numeric:tabular-nums}
canvas{width:100%;height:8rem;display:block}
.hint{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mut2);margin-top:.5rem}
/* metronome */
.bpm{font-size:5rem;font-weight:600;letter-spacing:-.05em;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bpmu{text-align:center;color:var(--mut2);font-size:.75rem;font-weight:600;letter-spacing:.1em;margin:.4rem 0 1.5rem}
.step{display:flex;gap:.5rem;margin-top:1.25rem}
.step button{flex:1;border:1px solid var(--ln);background:var(--sf2);border-radius:var(--rm);padding:.65rem 0;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;transition:.15s}
.step button:active{transform:scale(.94);background:var(--bd)}
.dots{display:flex;gap:.75rem;justify-content:center;margin:.5rem 0 1.5rem}
.dots i{width:1rem;height:1rem;border-radius:50%;background:var(--bd);transition:background .08s,transform .12s var(--ease)}
.dots i.hit{background:var(--ac);transform:scale(1.5)}.dots i.hit.acc{background:var(--ok);transform:scale(1.8)}
/* form controls */
input[type=range]{-webkit-appearance:none;appearance:none;height:.375rem;border-radius:1rem;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--bd) var(--p,0%));width:100%;margin:.6rem 0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3),0 0 0 1px var(--ln)}
input[type=range]::-moz-range-thumb{width:1.6rem;height:1.6rem;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:3rem;height:1.8rem;border-radius:2rem;background:var(--bd);position:relative;transition:background .25s;cursor:pointer;flex:none;margin:0}
input[type=checkbox]::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
input[type=checkbox]:checked{background:var(--ac)}input[type=checkbox]:checked::after{transform:translateX(1.2rem)}
select{-webkit-appearance:none;appearance:none;background:transparent;border:0;color:var(--mut);text-align:right;cursor:pointer;padding:.2rem 0;max-width:12rem}
select option{color:#222}
label.li{cursor:pointer}
/* onboarding */
.ov{position:fixed;inset:0;background:var(--bg);z-index:9;overflow-y:auto;padding:calc(2rem + env(safe-area-inset-top,0px)) 1.25rem calc(2rem + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .35s}
.ov.on{opacity:1;pointer-events:auto}.ov>div{max-width:30rem;margin:0 auto}
.ov h1{font-size:2rem;letter-spacing:-.035em;line-height:1.15;margin:1.5rem 0 .5rem}
.role{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--ln);border-radius:var(--r);padding:1.1rem;margin-top:.75rem;cursor:pointer;box-shadow:var(--sh);transition:.25s var(--ease)}
.role:hover{border-color:var(--mut2)}.role:active{transform:scale(.985)}
.role.cur{border-color:var(--ac);background:var(--acs)}
.role .tx{flex:1}.role b{display:block;font-size:1.0625rem;letter-spacing:-.015em}.role .mut{font-size:.8125rem;line-height:1.4;display:block}
.role::after{content:"";width:1.4rem;height:1.4rem;border-radius:50%;border:1.5px solid var(--bd);flex:none;transition:.25s}
.role.cur::after{border:.45rem solid var(--ac);background:#fff}
.lang{display:flex;justify-content:center;margin-top:1.75rem}.lang select{text-align:center;color:var(--mut)}
/* big text mode & responsive */
html.big nav button{font-size:.55rem}
@media (min-width:640px){.tiles{gap:1.25rem}.pt h1{font-size:2.5rem}main{padding:.5rem 2rem 3rem}header{padding:.75rem 2rem}}
@media (min-width:900px){
 html:not(.big) body{grid-template-columns:16rem 1fr;grid-template-areas:"n h""n m"}
 html:not(.big) nav{flex-direction:column;display:flex;gap:.25rem;padding:1.5rem 1rem;border-top:0;border-right:1px solid var(--ln);background:var(--sf)}
 html:not(.big) nav button{flex-direction:row;gap:.8rem;padding:.7rem .9rem;font-size:.9375rem;justify-content:flex-start}
 html:not(.big) nav button.on{background:var(--acs)}
 html:not(.big) nav .sb{display:flex;margin:0 .4rem 1.5rem}
 html:not(.big) header .hb{visibility:hidden}
 html:not(.big) .cols{grid-template-columns:1fr 1fr;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wide{max-width:44rem}

h_cam|用相機檢查四件事：弓是否和琴桿保持 90 度、左手臂高度、左手手形是否放鬆、肩膀是否聳起或歪斜。§把手機直立放好、前鏡頭對著自己，按「開啟相機」後會進入全螢幕。擺好標準姿勢按「校準」，倒數後記下你的弓、肩膀與手形。§二胡固定是左手按弦、右手拉弓，程式會自動辨認。琴桿位置是用左手和腰部推估，弓是用右手到琴筒上方的連線推估，所以請讓腰部以上都入鏡。§白色線是琴桿，虛線是和琴桿垂直的目標弓線，粗實線是你現在的弓：綠色代表有保持 90 度，紅色代表歪了。左臂的虛線是手肘的高度上限，手肘在線以下都可以（換到二、三把位手臂較低是正常的），抬得比線高才會變紅；左手骨架變紅代表手指張太開或太僵直；肩膀線變紅代表聳肩或一高一低。§左手應像握著東西般自然彎曲、手指靠攏、肌肉不緊繃。|Checks four things: bow at 90° to the neck, left arm height, relaxed left-hand shape, and raised or uneven shoulders.§Press Start camera; the screen turns to landscape full screen, so stand the phone sideways with the front camera facing you. Hold your best posture and press Calibrate.§Left hand on the strings, right hand bowing, detected automatically. The neck is estimated from your left hand and hip, the bow from your right hand to just above the soundbox, so keep everything above your waist in frame.§The white line is the neck, the dashed line is the target bow line at a right angle, the thick solid line is your bow: green means 90°, red means tilted. The dashed line and circle on the left arm mark the ideal elbow height; a red hand skeleton means spread or stiff fingers; a red shoulder line means raised or uneven shoulders.§The left hand should curve naturally, fingers together, muscles relaxed.

function brkUI(){if(!BRK)return;const left=Math.max(0,(BRK.end-Date.now())/1000);$('#brkTime').textContent=mmss(left);const ok=left<=0;$('#brkGo').disabled=!ok;$('#brkGo').textContent=t(ok?'brkDone':'brkWait');
 if(ok&&!BRK.rang){BRK.rang=1;tkChime();toast(t('brkEnd'))}}
function brkEnd(resume){BRK=null;$('#brk').hidden=true;S.task.sinceBrk=0;save();if(resume&&TK){TK.run=true;TK.last=Date.now()}tkUI()}

 if(!(stream||(P&&P.on)||playing||camOn||DM))S.log[today()]=(S.log[today()]||0)+dt;

 if(S.task.brk)S.task.sinceBrk=(S.task.sinceBrk||0)+dt;

const WALK=[['today','#todayLesson','w1'],['today','#grow','w2'],['course','#courseMap','w3'],['songs','#songCards','w4'],['home','.tiles','w5'],['tune','#gauge','w6'],['drill','#dDemo','w7',1],['me','#meList','w8']];
let WK=0,walkOn=false,walkMode='t';
function startWalk(){walkMode=S.mode||'t';if(stream)mic();if(camOn)stopCam();walkOn=true;WK=0;$('#coach').hidden=true;$('#help').classList.remove('on');$('#tour').classList.remove('on');$('#walk').hidden=false;drawWalk()}
function endWalk(){walkOn=false;S.guided.tune=1;S.guided.drill=1;$('#walk').hidden=true;S.toured=1;save();view(startView())}
function drawWalk(){const [v,,k]=WALK[WK],[ti,de]=t(k).split('§');if(!$('#v-'+v).classList.contains('on'))view(v);
 $('#wStep').textContent=(WK+1)+' / '+WALK.length;$('#wT').textContent=ti;$('#wD').textContent=de;$('#wNext').textContent=t(WK===WALK.length-1?'done':'next');$('#wPrev').hidden=WK===0;$('#wSkip').hidden=WK===WALK.length-1;
 const el=document.querySelector(WALK[WK][1]);if(el&&el.offsetParent!==null&&!el.closest('nav'))el.scrollIntoView({block:'center',behavior:'instant'});
 if(S.read)speak(ti+'。'+de);requestAnimationFrame(()=>requestAnimationFrame(placeWalk))}
function placeWalk(){if(!walkOn)return;const el=document.querySelector(WALK[WK][1]),ring=$('#wRing'),bub=$('#wBub'),W=innerWidth,H=innerHeight,bw=bub.offsetWidth,bh=bub.offsetHeight;
 let r=el&&el.offsetParent!==null?el.getBoundingClientRect():null;if(r&&(r.width===0||r.bottom<0||r.top>H))r=null;
 if(!r){ring.style.cssText=`left:${W/2}px;top:${H/2}px;width:0;height:0`;bub.style.left=Math.max(12,(W-bw)/2)+'px';bub.style.top=Math.max(12,(H-bh)/2)+'px';return}
 const p=6;ring.style.cssText=`left:${r.left-p}px;top:${r.top-p}px;width:${r.width+2*p}px;height:${r.height+2*p}px`;
 const below=r.top+r.height/2<H/2;let top=below?r.bottom+p+12:r.top-p-12-bh;top=Math.max(12,Math.min(H-bh-12,top));
 bub.style.top=top+'px';bub.style.left=Math.max(12,Math.min(W-bw-12,r.left+r.width/2-bw/2))+'px'}
const walkHit=e=>{if(!walkOn||e.target.closest('#wBub'))return 0;const el=document.querySelector(WALK[WK][1]);return el&&(el===e.target||el.contains(e.target))?(WALK[WK][3]?2:1):-1};
document.addEventListener('click',e=>{const h=walkHit(e);if(!h)return;if(h===2){setTimeout(()=>{if(walkOn)$('#wNext').click()},350);return}e.preventDefault();e.stopPropagation();if(h===1)$('#wNext').click()},true);
document.addEventListener('mousedown',e=>{const h=walkHit(e);if(h===1||h===-1)e.preventDefault()},true);
$('#wNext').onclick=()=>{WK<WALK.length-1?(WK++,drawWalk()):endWalk()};$('#wPrev').onclick=()=>{if(WK>0){WK--;drawWalk()}};$('#wSkip').onclick=endWalk;
addEventListener('resize',()=>{if(walkOn)placeWalk()});$('main').addEventListener('scroll',()=>{if(walkOn)placeWalk()},{passive:true});
